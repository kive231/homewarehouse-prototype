<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家庭仓库 — Huashu Redesign</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#f3f7f5; --screen-bg:#f8fbfa; --card:#fff; --ink:#1a232e;
  --muted:#7d8e99; --line:#e2edeb; --brand:#35a99a; --brand2:#7abdf6;
  --orange:#ee9a2c; --red:#e8606d; --green:#3cb982;
  --shadow:0 8px 28px rgba(25,85,75,.07); --soft:0 3px 12px rgba(25,85,75,.04);
  --phone-w:290px; --phone-h:610px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(170deg,#e4f3f0 0%,#f0f7f5 40%,#f8fbfa 100%);
  color:var(--ink);min-height:100vh;padding:28px 20px;
}
h1{text-align:center;font-size:22px;font-weight:720;letter-spacing:-.3px;color:#162530;margin-bottom:6px}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:28px}
.tile-grid{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;max-width:1400px;margin:0 auto}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.phone{
  width:var(--phone-w);height:var(--phone-h);
  background:#0b1020;border-radius:28px;padding:10px;
  box-shadow:0 28px 72px rgba(12,20,30,.18),inset 0 0 0 1px rgba(255,255,255,.04);
  position:relative;
}
.phone::before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:72px;height:5px;background:#1e293b;border-radius:99px;z-index:10;
}
.screen{
  width:100%;height:100%;background:var(--screen-bg);border-radius:20px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.status-bar{
  height:30px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);
  font-size:11px;font-weight:620;flex-shrink:0;color:#1a2a34;
}
.status-bar svg{width:13px;height:13px}
.nav-bar{
  height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;
}
.nav-bar .back-btn{
  width:30px;height:30px;border-radius:14px;background:rgba(53,169,154,.1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--brand);flex-shrink:0;border:none;font-size:16px;
}
.nav-bar .title{font-size:15px;font-weight:680;letter-spacing:-.2px;flex:1}
.nav-bar .action{font-size:12px;color:var(--brand);font-weight:620;cursor:pointer;border:none;background:none}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{display:none}
.content{padding:12px 14px 80px;display:flex;flex-direction:column;gap:12px}
.tab-bar{
  height:54px;display:flex;align-items:center;
  background:rgba(255,255,255,.88);backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.04);flex-shrink:0;position:relative;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:9px;color:#9aaab6;font-weight:550;cursor:pointer;
  border:none;background:none;padding:6px 0;
}
.tab-item.active{color:var(--brand)}
.tab-item svg{width:18px;height:18px}
.tab-scan-slot{flex:0 0 56px;display:flex;justify-content:center;position:relative}
.tab-scan-btn{
  width:48px;height:48px;border-radius:22px;
  background:linear-gradient(135deg,#2da598,#68b5f2);
  box-shadow:0 10px 24px rgba(52,162,149,.28);
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;border:none;position:absolute;bottom:-2px;
}
.tab-scan-btn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--soft);border:1px solid var(--line)}
.hero-card{
  background:linear-gradient(135deg,#2aa395,#62b5f2);color:#fff;
  border-radius:20px;padding:18px;box-shadow:0 14px 32px rgba(48,160,148,.22);
}
.hero-card h2{font-size:24px;font-weight:720;letter-spacing:-.5px}
.hero-card p{font-size:11px;opacity:.84;margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-item{text-align:center;padding:10px 4px;cursor:pointer}
.stat-item b{display:block;font-size:20px;font-weight:720;color:var(--ink)}
.stat-item span{font-size:10px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 -2px}
.section-head b{font-size:14px;font-weight:700;color:var(--ink)}
.section-head a{font-size:11px;color:var(--brand);cursor:pointer;border:none;background:none;font-weight:600}
.list-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.list-item:last-child{border-bottom:none}
.list-icon{
  width:38px;height:38px;border-radius:12px;background:#e7f6f3;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:var(--brand);font-size:18px;
}
.list-info{flex:1;min-width:0}
.list-info b{display:block;font-size:14px;font-weight:600}
.list-info small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.list-right{text-align:right;flex-shrink:0}
.tag{
  display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:650;
}
.tag.ok{background:#e7f7f2;color:var(--green)}
.tag.warn{background:#fff5e4;color:#cb8118}
.tag.bad{background:#fff0f2;color:#d9535c}
.tag.brand{background:#e2f5f3;color:var(--brand)}
.search-bar{
  display:flex;align-items:center;gap:8px;background:#f2f7f5;
  border-radius:14px;padding:10px 14px;font-size:12px;color:var(--muted);
}
.btn{
  width:100%;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:620;
  cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:linear-gradient(135deg,#2aa395,#58b0e8);color:#fff;box-shadow:0 8px 20px rgba(42,163,149,.22)}
.btn-outline{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn-danger{background:#fff0f2;color:#d9535c;border:1px solid #fdd}
.action-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.action-tile{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  box-shadow:var(--soft);
}
.action-tile svg{color:var(--brand);width:22px;height:22px}
.action-tile b{font-size:13px;font-weight:650}
.action-tile small{font-size:10px;color:var(--muted)}
.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-btn{
  aspect-ratio:1;background:#f4f9f7;border-radius:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--ink);border:none;
}
.tree-item{
  display:flex;align-items:center;gap:10px;padding:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  cursor:pointer;box-shadow:var(--soft);
}
.tree-item b{font-size:14px;flex:1}
.tree-item small{font-size:10px;color:var(--muted)}
.progress-bar{
  height:4px;border-radius:2px;background:#e8f0ed;margin-top:8px;
}
.progress-bar .fill{height:100%;border-radius:2px;background:var(--green)}
.progress-bar .fill.warn{background:var(--orange)}
.progress-bar .fill.bad{background:var(--red)}
.breadcrumb{
  display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);
  padding:0 0 4px;flex-wrap:wrap;
}
.breadcrumb span{cursor:pointer;color:var(--brand)}
.setting-row{
  display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.setting-row:last-child{border-bottom:none}
.setting-icon{
  width:36px;height:36px;border-radius:12px;background:#e7f6f3;
  display:flex;align-items:center;justify-content:center;color:var(--brand);
}
.setting-text{flex:1}
.setting-text b{display:block;font-size:14px;font-weight:600}
.setting-text small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.setting-arrow{color:#bec7ce;font-size:18px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;
  background:#eef7f4;color:#507d74;border:none;
}
.chip.active{background:var(--brand);color:#fff}
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qr-item{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px;text-align:center;box-shadow:var(--soft);
}
.qr-item .qr-block{
  width:56px;height:56px;margin:0 auto 8px;border-radius:10px;
  background:repeating-linear-gradient(45deg,#1a7a6e 0 4px,#fff 4px 8px);
}
.detail-hero{
  background:linear-gradient(135deg,#f9fdfc,#eef8f5);
  border:1px solid var(--line);border-radius:18px;padding:16px;
  text-align:center;
}
.detail-hero h2{font-size:18px;font-weight:680}
.detail-hero .count{font-size:32px;font-weight:750;color:var(--brand);margin:4px 0}
.info-row{
  display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:12px;
}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--muted)}
.info-row .v{font-weight:600}
.input-field{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:14px;outline:none;background:#f9fbfa;
}
.input-field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(53,169,154,.1)}
.form-stack{display:flex;flex-direction:column;gap:12px}
.form-label{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:2px}
.login-page{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 30px;gap:20px;height:100%;
}
.login-logo{
  width:64px;height:64px;border-radius:20px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;
}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.32);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:var(--phone-w);
  max-height:70%;overflow-y:auto;padding:20px 16px 32px;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-size:16px;margin-bottom:14px;text-align:center}
</style>
</head>

function StatusTag({status,expireIn}){
  if(status==="expiring") return <span className="tag warn">{expireIn}天</span>;
  if(status==="low") return <span className="tag bad">低库存</span>;
  return null;
}

function ModalSheet({title,children,onClose}){
  return (
    <div className="modal-overlay" onClick={(e)=>{if(e.target===e.currentTarget) onClose()}}>
      <div className="modal-sheet">
        <h3>{title}</h3>
        {children}
      </div>
    </div>
  );
}

// ======== ITEMS SCREEN ========
function ItemsScreen({onNavigate,filter}){
  const [cat,setCat]=useState(filter||'全部');
  const cats=['全部','画材','工具','纸张'];
  let items=data.allItems;
  if(cat!=='全部') items=items.filter(i=>i.cat===cat);
  if(filter==='expiring') items=items.filter(i=>i.status==='expiring');
  if(filter==='low') items=items.filter(i=>i.status==='low');

  return (
    <div className="scroll-area">
      <div className="content">
        <div className="search-bar">{Icons.search}<span>搜索物品、分类、位置</span></div>
        <div className="chip-row">
          {cats.map(c=><button key={c} className={"chip"+(cat===c?" active":"")} onClick={()=>setCat(c)}>{c}</button>)}
        </div>
        <div className="section-head"><b>{cat}</b><a onClick={()=>onNavigate('item-form')}>+新增</a></div>
        <div className="card" style={{padding:'0 14px'}}>
          {items.map(it=>(
            <div key={it.id} className="list-item" onClick={()=>onNavigate('item-detail',it.id)}>
              <div className="list-icon">{Icons.box}</div>
              <div className="list-info">
                <b>{it.name}</b>
                <small>{it.loc}</small>
              </div>
              <div className="list-right">
                {it.status==="ok" && <span style={{fontWeight:700,fontSize:13}}>×{it.qty}</span>}
                <StatusTag status={it.status} expireIn={it.expireIn}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

          <h2>{item.name}</h2>
          <div className="count">{item.qty}</div>
          <StatusTag status={item.status} expireIn={item.expireIn}/>
        </div>

        <div className="card">
          <div className="info-row"><span className="k">分类</span><span className="v">{item.cat}</span></div>
          <div className="info-row"><span className="k">位置</span><span className="v">{item.loc}</span></div>
          <div className="info-row"><span className="k">数量</span><span className="v">{item.qty}</span></div>
          {item.expireIn && <div className="info-row"><span className="k">到期</span><span className="v" style={{color:'var(--orange)'}}>{item.expireIn}天后</span></div>}

          <button className="btn btn-outline" onClick={()=>setModal('consume')}>{Icons.minus} 消耗</button>
          <button className="btn btn-outline" onClick={()=>setModal('replenish')}>{Icons.plus} 补货</button>

// ======== SPACE SCREEN ========
function SpaceScreen({onNavigate}){
  const [view,setView]=useState('cabinets');
  const [selCabinet,setSelCabinet]=useState(null);
  const [selLayer,setSelLayer]=useState(null);
  const [mode,setMode]=useState('space');

  if(view==='cabinets'){
    return (
      <div className="scroll-area">
        <div className="content">
          <div className="chip-row">
            <button className={"chip"+(mode==='space'?" active":"")} onClick={()=>setMode('space')}>空间</button>
            <button className={"chip"+(mode==='category'?" active":"")} onClick={()=>setMode('category')}>分类</button>
          </div>

          {mode==='space' && <>
            <div className="section-head"><b>空间管理</b><a onClick={()=>onNavigate('item-form')}>+柜子</a></div>
            {data.cabinets.map(c=>(
              <div key={c.id} className="tree-item" onClick={()=>{setSelCabinet(c);setView('layers:'+c.id)}}>
                <div className="list-icon">{Icons.cabinet}</div>
                <div style={{flex:1}}>
                  <b>{c.name}</b>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
                    <small>{c.layers}层 · {c.boxes}盒 · {c.items}件</small>
                    {c.pct>85?<span className="tag bad">满</span>:c.pct>70?<span className="tag warn">偏满</span>:<span className="tag ok">正常</span>}
                  </div>
                  <div className="progress-bar" style={{width:'80%'}}>
                    <div className={"fill"+(c.pct>85?" bad":c.pct>70?" warn":"")} style={{width:c.pct+'%'}}/>
                  </div>
                </div>
                {Icons.chevronR}
              </div>
            ))}
            <div className="card">
              <div className="section-head"><b>概览</b></div>
              <div className="stats-row">
                <div className="stat-item"><b>{data.summary.cabinets}</b><span>柜子</span></div>
                <div className="stat-item"><b>{data.summary.boxes}</b><span>盒子</span></div>
                <div className="stat-item"><b style={{color:'var(--orange)'}}>{data.summary.fullBoxes}</b><span>偏高</span></div>
              </div>
            </div>
          </>}

          {mode==='category' && <>
            <div className="section-head"><b>分类管理</b><a>+分类</a></div>
            {data.categories.map(cat=>(
              <div key={cat.id} className="tree-item">
                <div className="list-icon">{Icons.box}</div>
                <div style={{flex:1}}>
                  <b>{cat.name}</b>
                  <small>{cat.subs.join(' · ')}</small>
                </div>
                {Icons.chevronR}
              </div>
            ))}
          </>}
        </div>
      </div>
    );
  }

  if(view.startsWith('layers:')){
    const cid=parseInt(view.split(':')[1]);
    const cab=data.cabinets.find(c=>c.id===cid);
    const layers=data.cabinetLayers[cid]||[];
    return (
      <div className="scroll-area">
        <div className="content">
          <div className="breadcrumb">
            <span onClick={()=>setView('cabinets')}>空间</span> › <b>{cab?.name}</b>
          </div>
          {layers.map(l=>(
            <div key={l.id} className="tree-item" onClick={()=>{setSelLayer(l);setView('boxes:'+l.id)}}>
              <div className="list-icon">{Icons.box}</div>
              <div style={{flex:1}}>
                <b>{l.name}</b>
                <small>{l.boxes}盒 · {l.items}件</small>
              </div>
              {Icons.chevronR}
            </div>
          ))}
          <button className="btn btn-outline" style={{marginTop:4}}>{Icons.plus} 添加层</button>
        </div>
      </div>
    );
  }

  if(view.startsWith('boxes:')){
    const lid=parseInt(view.split(':')[1]);
    const boxes=data.layerBoxes[lid]||[];
    return (
      <div className="scroll-area">
        <div className="content">
          <div className="breadcrumb">
            <span onClick={()=>setView('cabinets')}>空间</span> › <span onClick={()=>setView('layers:'+(selCabinet?.id||1))}>{selCabinet?.name||'柜子'}</span> › <b>{selLayer?.name||'层'}</b>
          </div>
          {boxes.map(b=>(
            <div key={b.id} className="tree-item">
              <div className="list-icon">{Icons.box}</div>
              <div style={{flex:1}}>
                <b>{b.name}</b>
                <small>{b.items}件</small>
              </div>
              {Icons.chevronR}
            </div>
          ))}
          <button className="btn btn-outline" style={{marginTop:4}}>{Icons.plus} 添加盒子</button>
        </div>
      </div>
    );
  }

  return null;
}

// ======== APP PHONE ========
function AppPhone({initialTab}){
  const [tab,setTab]=useState(initialTab||'home');
  const [screen,setScreen]=useState('login');
  const [screenParams,setScreenParams]=useState(null);
  const [navStack,setNavStack]=useState([]);

  const navigate = (s,p) => {
    if(s==='items'||s==='space'){
      setTab(s==='items'?'items':'space');
      setScreen('main');
      setScreenParams(p);
      setNavStack([]);
    }else if(s==='item-detail'||s==='item-form'||s==='records'||s==='qrcode'||s==='scan'){
      setNavStack(prev=>[...prev,{screen:s,params:p}]);
      setScreen(s);
      setScreenParams(p);
    }
  };

  const goBack = () => {
    if(navStack.length>0){
      const prev=navStack[navStack.length-1];
      setNavStack(navStack.slice(0,-1));
      setScreen(prev.screen);
      setScreenParams(prev.params);
    }else{
      setScreen('main');
      setScreenParams(null);
    }
  };

  const getTitle = () => {
    if(screen==='item-detail') return '物品详情';
    if(screen==='item-form') return '新增物品';
    if(screen==='records') return '出入库记录';
    if(screen==='qrcode') return '二维码管理';
    if(screen==='scan') return '扫码';
    if(screen==='login') return '';
    if(tab==='home') return '首页';
    if(tab==='items') return '物品';
    if(tab==='space') return '空间';
    if(tab==='me') return '我的';
    return '';
  };

  const showNav = screen!=='main'||tab==='home';
  const showBack = screen!=='main' && screen!=='login';

  if(screen==='login'){
    return (
      <div className="phone">
        <div className="screen">
          <div className="status-bar"><b>09:41</b><span>5G &nbsp;82%</span></div>
          <LoginScreen onSkip={()=>{setScreen('main');setNavStack([])}}/>
        </div>
      </div>
    );
  }

  return (
    <div className="phone">
      <div className="screen">
        <div className="status-bar"><b>09:41</b><span>5G &nbsp;82%</span></div>
        {showNav && (
          <div className="nav-bar">
            {showBack && <button className="back-btn" onClick={goBack}>{Icons.chevronL}</button>}
            <span className="title">{getTitle()}</span>
            {screen==='main' && tab==='space' && <button className="action">搜索</button>}
          </div>
        )}

        {screen==='main' && tab==='home' && <HomeScreen onNavigate={navigate}/>}
        {screen==='main' && tab==='items' && <ItemsScreen onNavigate={navigate} filter={screenParams}/>}
        {screen==='main' && tab==='space' && <SpaceScreen onNavigate={navigate}/>}
        {screen==='main' && tab==='me' && <ProfileScreen onNavigate={navigate}/>}
        {screen==='item-detail' && <ItemDetail itemId={screenParams} onNavigate={navigate}/>}
        {screen==='item-form' && <ItemForm/>}
        {screen==='records' && <RecordsScreen/>}
        {screen==='qrcode' && <QRCodeScreen/>}
        {screen==='scan' && <ScanScreen/>}

        <div className="tab-bar">
          <button className={"tab-item"+(tab==='home'?' active':'')} onClick={()=>{setTab('home');setScreen('main');setNavStack([])}}>
            {Icons.home}<span>首页</span>
          </button>
          <button className={"tab-item"+(tab==='items'?' active':'')} onClick={()=>{setTab('items');setScreen('main');setNavStack([])}}>
            {Icons.box}<span>物品</span>
          </button>
          <div className="tab-scan-slot">
            <button className="tab-scan-btn" onClick={()=>navigate('scan')}>{Icons.scan}</button>
          </div>
          <button className={"tab-item"+(tab==='space'?' active':'')} onClick={()=>{setTab('space');setScreen('main');setNavStack([])}}>
            {Icons.cabinet}<span>空间</span>
          </button>
          <button className={"tab-item"+(tab==='me'?' active':'')} onClick={()=>{setTab('me');setScreen('main');setNavStack([])}}>
            {Icons.user}<span>我的</span>
          </button>
        </div>
      </div>
    </div>
  );
}

// ======== MAIN ========
function App(){
  const phones=[
    {id:1,label:'首页 · Home',tab:'home'},
    {id:2,label:'物品 · Items',tab:'items'},
    {id:3,label:'空间 · Spaces',tab:'space'},
    {id:4,label:'我的 · Profile',tab:'me'},
  ];

  return phones.map(p=>(
    <div key={p.id} className="tile">
      <div className="tile-label">{p.label}</div>
      <AppPhone initialTab={p.tab}/>
    </div>
  ));
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
