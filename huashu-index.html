<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家庭仓库 — Huashu Redesign</title>
<style>
:root{
  --bg:#f3f7f5; --screen-bg:#f8fbfa; --card:#fff; --ink:#1a232e;
  --muted:#7d8e99; --line:#e2edeb; --brand:#35a99a; --brand2:#7abdf6;
  --orange:#ee9a2c; --red:#e8606d; --green:#3cb982;
  --shadow:0 8px 28px rgba(25,85,75,.07); --soft:0 3px 12px rgba(25,85,75,.04);
  --phone-w:290px; --phone-h:610px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(170deg,#e4f3f0 0%,#f0f7f5 40%,#f8fbfa 100%);
  color:var(--ink);min-height:100vh;padding:28px 20px;
}
h1{text-align:center;font-size:22px;font-weight:720;letter-spacing:-.3px;color:#162530;margin-bottom:4px}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:28px}

.tile-grid{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;max-width:1400px;margin:0 auto}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.8px}

.phone{
  width:var(--phone-w);height:var(--phone-h);
  background:#0b1020;border-radius:28px;padding:10px;
  box-shadow:0 28px 72px rgba(12,20,30,.18),inset 0 0 0 1px rgba(255,255,255,.04);
  position:relative;
}
.phone::before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:72px;height:5px;background:#1e293b;border-radius:99px;z-index:10;
}
.screen{
  width:100%;height:100%;background:var(--screen-bg);border-radius:20px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}

.status-bar{
  height:30px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);
  font-size:11px;font-weight:620;flex-shrink:0;color:#1a2a34;
}
.nav-bar{
  height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;
}
.nav-bar .back-btn{
  width:30px;height:30px;border-radius:14px;background:rgba(53,169,154,.1);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  color:var(--brand);border:none;font-size:16px;flex-shrink:0;
}
.nav-bar .back-btn.visible{display:flex}
.nav-bar .title{font-size:15px;font-weight:680;letter-spacing:-.2px;flex:1}
.nav-bar .action{font-size:12px;color:var(--brand);font-weight:620;cursor:pointer;border:none;background:none;display:none}

.scroll-area{flex:1;overflow-y:auto}
.scroll-area::-webkit-scrollbar{display:none}
.page-content{padding:12px 14px 80px;display:flex;flex-direction:column;gap:12px}

.tab-bar{
  height:54px;display:flex;align-items:center;
  background:rgba(255,255,255,.88);backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.04);flex-shrink:0;position:relative;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:9px;color:#9aaab6;font-weight:550;cursor:pointer;
  border:none;background:none;padding:6px 0;
}
.tab-btn.active{color:var(--brand)}
.tab-btn svg{width:18px;height:18px}
.tab-scan-slot{flex:0 0 56px;display:flex;justify-content:center;position:relative}
.tab-scan-btn{
  width:48px;height:48px;border-radius:22px;
  background:linear-gradient(135deg,#2da598,#68b5f2);
  box-shadow:0 10px 24px rgba(52,162,149,.28);
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;border:none;position:absolute;bottom:-2px;
}
.tab-scan-btn svg{width:22px;height:22px}

/* Cards */
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--soft);border:1px solid var(--line)}
.hero-card{
  background:linear-gradient(135deg,#2aa395,#62b5f2);color:#fff;
  border-radius:20px;padding:18px;box-shadow:0 14px 32px rgba(48,160,148,.22);
}
.hero-card h2{font-size:24px;font-weight:720;letter-spacing:-.5px}
.hero-card p{font-size:11px;opacity:.84;margin-top:4px}
.hero-card .sm{font-size:10px;opacity:.7}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-item{text-align:center;padding:10px 4px;cursor:pointer}
.stat-item b{display:block;font-size:20px;font-weight:720}
.stat-item span{font-size:10px;color:var(--muted)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 -2px}
.section-head b{font-size:14px;font-weight:700}
.section-head a{font-size:11px;color:var(--brand);cursor:pointer;font-weight:600}

.list-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.list-item:last-child{border-bottom:none}
.list-icon{
  width:38px;height:38px;border-radius:12px;background:#e7f6f3;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--brand);
}
.list-icon svg{width:18px;height:18px}
.list-info{flex:1;min-width:0}
.list-info b{display:block;font-size:14px;font-weight:600}
.list-info small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.list-right{text-align:right;flex-shrink:0}

.tag{padding:3px 8px;border-radius:8px;font-size:10px;font-weight:650}
.tag.ok{background:#e7f7f2;color:var(--green)}
.tag.warn{background:#fff5e4;color:#cb8118}
.tag.bad{background:#fff0f2;color:#d9535c}

.search-bar{
  display:flex;align-items:center;gap:8px;background:#f2f7f5;
  border-radius:14px;padding:10px 14px;font-size:12px;color:var(--muted);
}

.btn{
  border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:620;
  cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:linear-gradient(135deg,#2aa395,#58b0e8);color:#fff;box-shadow:0 8px 20px rgba(42,163,149,.22);width:100%}
.btn-outline{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn-danger{background:#fff0f2;color:#d9535c;border:1px solid #fdd}

.action-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.action-tile{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  box-shadow:var(--soft);
}
.action-tile svg{color:var(--brand);width:22px;height:22px}
.action-tile b{font-size:13px;font-weight:650}
.action-tile small{font-size:10px;color:var(--muted)}

.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-btn{
  aspect-ratio:1;background:#f4f9f7;border-radius:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:12px;font-weight:600;border:none;
}

.tree-item{
  display:flex;align-items:center;gap:10px;padding:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  cursor:pointer;box-shadow:var(--soft);
}
.tree-item b{font-size:14px}
.tree-item small{font-size:10px;color:var(--muted)}
.tree-body{flex:1}
.progress-bar{
  height:4px;border-radius:2px;background:#e8f0ed;margin-top:8px;
}
.progress-bar .fill{height:100%;border-radius:2px;background:var(--green)}
.progress-bar .fill.warn{background:var(--orange)}
.progress-bar .fill.bad{background:var(--red)}

.breadcrumb{
  display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);
  padding:0 0 4px;flex-wrap:wrap;
}
.breadcrumb span{cursor:pointer;color:var(--brand)}

.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;
  background:#eef7f4;color:#507d74;border:none;
}
.chip.active{background:var(--brand);color:#fff}

.detail-hero{
  background:linear-gradient(135deg,#f9fdfc,#eef8f5);
  border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;
}
.detail-hero h2{font-size:18px;font-weight:680}
.detail-hero .count{font-size:32px;font-weight:750;color:var(--brand);margin:4px 0}

.info-row{
  display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:12px;
}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--muted)}
.info-row .v{font-weight:600}

.form-stack{display:flex;flex-direction:column;gap:12px}
.form-label{font-size:12px;font-weight:600;margin-bottom:2px}
.input-field{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:14px;outline:none;background:#f9fbfa;
}

.setting-row{
  display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.setting-row:last-child{border-bottom:none}
.setting-icon{
  width:36px;height:36px;border-radius:12px;background:#e7f6f3;
  display:flex;align-items:center;justify-content:center;color:var(--brand);
}
.setting-icon svg{width:18px;height:18px}
.setting-text{flex:1}
.setting-text b{display:block;font-size:14px;font-weight:600}
.setting-text small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.setting-arrow{color:#bec7ce;font-size:18px}

.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qr-item{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px;text-align:center;box-shadow:var(--soft);
}
.qr-block{
  width:56px;height:56px;margin:0 auto 8px;border-radius:10px;
  background:repeating-linear-gradient(45deg,#1a7a6e 0 4px,#fff 4px 8px);
}

.record-action{font-weight:700;font-size:12px}
.record-time{font-size:10px;color:var(--muted)}

.page{display:none}
.page.active{display:block}
</style>
</head>
<body>
<h1>家庭仓库</h1>
<p class="sub">Huashu Redesign · 4 Tab · 薄荷青</p>
<div class="tile-grid">

<script>
// ======== SVG Icons ========
var I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>',
  cabinet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="4" y1="10" x2="20" y2="10"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V5a2 2 0 012-2h2"/><path d="M17 3h2a2 2 0 012 2v2"/><path d="M21 17v2a2 2 0 01-2 2h-2"/><path d="M7 21H5a2 2 0 01-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  chevronR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>',
  chevronL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 002.83-2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>',
  qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  export:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
};

// ======== BUILD 4 PHONES ========
var tabs = [
  {id:'home', label:'首页 · Home', icon:I.home, title:'首页'},
  {id:'items', label:'物品 · Items', icon:I.box, title:'物品'},
  {id:'space', label:'空间 · Spaces', icon:I.cabinet, title:'空间'},
  {id:'me', label:'我的 · Profile', icon:I.user, title:'我的'},
];

function S(cls,html){ return '<div class="'+cls+'">'+html+'</div>'; }

// Status tag helper
function statusTag(st,exp){
  if(st==='expiring') return '<span class="tag warn">'+exp+'天</span>';
  if(st==='low') return '<span class="tag bad">低库存</span>';
  return '';
}

// ===== HOME PAGE =====
var homeHTML =
  S('hero-card','<div class="sm">家庭仓库</div><h2>128 件物品</h2><p>3 件临期 · 5 件低库存</p>') +
  S('card',S('stats-row',
    S('stat-item','<b style="color:var(--orange)">3</b><span>临期</span>')+
    S('stat-item','<b style="color:var(--red)">5</b><span>低库存</span>')+
    S('stat-item','<b>128</b><span>全部</span>')
  )) +
  S('action-row',
    S('action-tile',I.plus+'<b>新增物品</b><small>录入仓库</small>')+
    S('action-tile',I.scan+'<b>扫码</b><small>定位/绑定</small>')
  ) +
  S('section-head','<b>快捷入口</b>')+
  S('quick-row',
    '<button class="quick-btn">画材</button>'+
    '<button class="quick-btn">工具</button>'+
    '<button class="quick-btn">A柜</button>'+
    '<button class="quick-btn">工具柜</button>'
  ) +
  S('section-head','<b>最近物品</b><a>全部</a>')+
  S('card',
    S('list-item',S('list-icon',I.box)+S('list-info','<b>温莎牛顿 24色颜料</b><small>书房A柜 / 2层 / 蓝盒</small>')+S('list-right','<span class="tag warn">30天</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>8K 水彩纸</b><small>工具柜 / 1层 / 纸盒</small>')+S('list-right','<span class="tag bad">低库存</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>3M 美纹纸胶带</b><small>工具柜 / B盒</small>')+S('list-right','<span style="font-weight:700;font-size:13px">×4</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>A4 素描纸</b><small>书房A柜 / 3层</small>')+S('list-right','<span style="font-weight:700;font-size:13px">×20</span>'))
  );

// ===== ITEMS PAGE =====
var itemsHTML =
  S('search-bar',I.search+'<span>搜索物品、分类、位置</span>')+
  S('chip-row',
    '<button class="chip active">全部</button>'+
    '<button class="chip">画材</button>'+
    '<button class="chip">工具</button>'+
    '<button class="chip">纸张</button>'
  )+
  S('section-head','<b>全部</b><a>+新增</a>')+
  S('card',
    S('list-item',S('list-icon',I.box)+S('list-info','<b>温莎牛顿 24色颜料</b><small>画材 · 书房A柜/2层/蓝盒</small>')+S('list-right','<span class="tag warn">30天</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>8K 水彩纸</b><small>纸张 · 工具柜/1层/纸盒</small>')+S('list-right','<span class="tag bad">低库存</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>3M 美纹纸胶带</b><small>工具 · 工具柜/B盒</small>')+S('list-right','<span style="font-weight:700;font-size:13px">×4</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>A4 素描纸</b><small>纸张 · 书房A柜/3层</small>')+S('list-right','<span style="font-weight:700;font-size:13px">×20</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>辉柏嘉彩铅48色</b><small>画材 · 书房A柜/2层/绿盒</small>')+S('list-right','<span style="font-weight:700;font-size:13px">×1</span>')) +
    S('list-item',S('list-icon',I.box)+S('list-info','<b>美工刀 大号</b><small>工具 · 工具柜/A盒</small>')+S('list-right','<span style="font-weight:700;font-size:13px">×2</span>'))
  );

// ===== ITEM DETAIL PAGE =====
function itemDetailHTML(name,cat,loc,qty,exp){
  return (
    S('detail-hero','<div style="font-size:11px;color:var(--muted)">'+cat+' · '+loc+'</div><h2>'+name+'</h2><div class="count">'+qty+'</div>'+statusTag('expiring',exp)) +
    S('card',
      S('info-row','<span class="k">分类</span><span class="v">'+cat+'</span>')+
      S('info-row','<span class="k">位置</span><span class="v">'+loc+'</span>')+
      S('info-row','<span class="k">数量</span><span class="v">'+qty+'</span>')+
      S('info-row','<span class="k">到期</span><span class="v" style="color:var(--orange)">'+exp+'天后</span>')
    ) +
    S('action-row',
      '<button class="btn btn-outline" style="width:100%">'+I.minus+' 消耗</button>'+
      '<button class="btn btn-outline" style="width:100%">'+I.plus+' 补货</button>'
    )+
    '<button class="btn btn-outline" style="width:100%;margin-top:8px">'+I.edit+' 移动位置</button>'+
    '<button class="btn btn-danger" style="width:100%;margin-top:8px">删除物品</button>'
  );
}

// ===== ITEM FORM =====
var formHTML =
  S('section-head','<b>新增物品</b>')+
  S('card',S('form-stack',

<script>
// ===== INTERACTIVITY =====
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    var phoneId = this.dataset.phone;
    var tab = this.dataset.tab;
    // Update active tab
    this.parentElement.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    // Show correct page
    var container = document.getElementById(phoneId+'-content');
    container.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    var target = document.getElementById(phoneId+'-page-'+tab);
    if(target) target.classList.add('active');
    // Update title
    var titles = {home:'首页',items:'物品',space:'空间',me:'我的'};
    document.getElementById(phoneId+'-title').textContent = titles[tab]||'';
    // Hide back button
    document.getElementById(phoneId+'-back').classList.remove('visible');
  });
});

// Item list clicks → show detail
document.querySelectorAll('.list-item').forEach(function(item){
  item.addEventListener('click',function(){
    var phone = this.closest('.phone');
    var phoneId = phone ? phone.querySelector('.tab-btn').dataset.phone : null;
    if(!phoneId) return;
    // Show item detail
    var container = document.getElementById(phoneId+'-content');
    container.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    var detail = document.getElementById(phoneId+'-page-item-detail');
    if(detail) detail.classList.add('active');
    document.getElementById(phoneId+'-title').textContent = '物品详情';
    document.getElementById(phoneId+'-back').classList.add('visible');
  });
});

// Back buttons
document.querySelectorAll('.back-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    var phoneId = this.id.replace('-back','');
    var container = document.getElementById(phoneId+'-content');
    container.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    // Find which tab is active
    var activeTab = this.closest('.screen').querySelector('.tab-btn.active');
    var tab = activeTab ? activeTab.dataset.tab : 'home';
    var target = document.getElementById(phoneId+'-page-'+tab);
    if(target) target.classList.add('active');
    var titles = {home:'首页',items:'物品',space:'空间',me:'我的'};
    document.getElementById(phoneId+'-title').textContent = titles[tab]||'';
    this.classList.remove('visible');
  });
});
</script>
