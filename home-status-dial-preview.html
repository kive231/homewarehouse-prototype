<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:,">
<title>家庭仓库首页 - 状态总览</title>
<style>
:root{
  --primary:#6f7dcc;
  --primary-soft:#f1f3ff;
  --ok:#5baa9e;
  --warn:#e8a87c;
  --bad:#d9626e;
  --bg:#f8f9fc;
  --card:#fff;
  --ink:#252736;
  --muted:#8b90a0;
  --line:#eceef5;
  --shadow:0 8px 22px rgba(35,40,80,.07);
  --float:0 16px 34px rgba(35,40,80,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#dedee8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px}
button{font-family:inherit}
.phone{width:320px;height:682px;border-radius:30px;padding:10px;background:#171824;box-shadow:0 28px 72px rgba(20,22,42,.28),inset 0 0 0 1px rgba(255,255,255,.05);position:relative}
.phone:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:74px;height:5px;border-radius:99px;background:#2a2d42;z-index:5}
.screen{width:100%;height:100%;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fbfbff 0%,var(--bg) 46%,#f6f7fb 100%);display:flex;flex-direction:column}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10.5px;color:#5f6472;flex:0 0 auto}
.top{padding:12px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title b{display:block;font-size:21px;line-height:1.12;font-weight:680;letter-spacing:-.4px}
.title span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.search-dot{width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.content{padding:4px 18px 82px;display:flex;flex-direction:column;gap:14px}
.summary{border-radius:26px;background:linear-gradient(180deg,#fff 0%,#fbfbff 100%);border:1px solid rgba(236,238,245,.9);box-shadow:var(--float);position:relative;overflow:hidden;padding:18px}
.summary-main{display:flex;align-items:center;gap:14px}
.summary-icon{width:74px;height:74px;border-radius:24px;background:linear-gradient(145deg,var(--primary),#929de1);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 30px rgba(111,125,204,.2);flex:0 0 auto}
.summary-icon svg{width:34px;height:34px}
.summary-text strong{display:block;font-size:38px;line-height:.92;font-weight:740;letter-spacing:-1.2px;color:var(--ink)}
.summary-text span{display:block;margin-top:7px;font-size:12px;color:var(--muted)}
.health-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.health{min-height:62px;border-radius:17px;padding:10px 8px;border:1px solid #f0f1f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.health svg{width:20px;height:20px}
.health span{font-size:10px;color:#676d7d;font-weight:620}
.health.ok{background:#f1faf8;color:var(--ok)}
.health.warn{background:#fff6ee;color:var(--warn)}
.health.bad{background:#fff3f4;color:var(--bad)}
.flow{border-radius:21px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:15px 14px 14px}
.flow-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.flow-head b{font-size:14px;font-weight:720}
.flow-head span{font-size:10px;color:var(--muted);font-weight:620}
.flow-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:stretch}
.flow-item{aspect-ratio:1/1;min-height:78px;border-radius:18px;background:#f8f9fc;border:1px solid #f0f1f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.flow-item svg{width:19px;height:19px}
.flow-item b{font-size:13px;line-height:1;font-weight:760}
.flow-item span{font-size:10px;color:var(--muted);font-weight:580}
.flow-item.in{color:var(--ok);background:#f2faf8}
.flow-item.out{color:var(--bad);background:#fff5f6}
.flow-item.net{color:var(--primary);background:var(--primary-soft)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 0 0}
.action{height:68px;border:0;border-radius:19px;background:#fff;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.action svg{width:22px;height:22px;color:var(--primary)}
.action span{font-size:12px;color:#333746;font-weight:680}
.attention{border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.attention-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 3px}
.attention-head b{font-size:14px;font-weight:720}
.attention-head span{font-size:10px;color:var(--primary);font-weight:650}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #f2f3f8}
.row-icon{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.row-icon svg{width:18px;height:18px}
.row-icon.warn{background:#fff5ed;color:var(--warn)}
.row-icon.bad{background:#fff3f4;color:var(--bad)}
.row-body{flex:1;min-width:0}
.row-body b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-body span{display:block;margin-top:3px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-mark{font-size:10px;font-weight:720;color:var(--muted)}
.bottom-nav{height:70px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:linear-gradient(180deg,rgba(248,249,252,0),rgba(248,249,252,.96) 32%);margin-top:-70px;pointer-events:none;position:relative;z-index:12}
.nav-capsule{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);box-shadow:0 14px 30px rgba(35,40,80,.12);pointer-events:auto}
.nav-item,.nav-scan{border:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.nav-item{width:45px;height:38px;border-radius:999px;background:transparent}
.nav-item svg{width:18px;height:18px}
.nav-item.on{background:var(--primary-soft);color:var(--primary)}
.nav-scan{width:49px;height:49px;border-radius:18px;margin:-7px 3px;background:var(--primary);color:#fff;box-shadow:0 9px 18px rgba(111,125,204,.24)}
.nav-scan svg{width:22px;height:22px}
.annotate-toggle{position:fixed;right:22px;bottom:22px;z-index:40;border:0;border-radius:999px;background:var(--primary);color:#fff;padding:12px 16px;font-size:13px;font-weight:680;box-shadow:0 10px 24px rgba(111,125,204,.2);cursor:pointer}
.annotating .annotatable{outline:2px dashed rgba(111,125,204,.38);outline-offset:3px}
.annotating .annotatable:hover{outline-color:var(--primary);background-image:linear-gradient(rgba(111,125,204,.07),rgba(111,125,204,.07))}
.annotation-pin{display:none}
.annotation-panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:min(360px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 46px rgba(30,25,18,.18);padding:14px;display:none}
.annotation-panel.show{display:block}
.annotation-panel b{display:block;font-size:13px;margin-bottom:8px;color:var(--ink)}
.annotation-panel textarea{width:100%;height:84px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;background:#f8f9fc}
.annotation-panel textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.annotation-actions{display:flex;gap:8px;margin-top:10px}
.annotation-actions button{flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:680;cursor:pointer}
.annotation-save{background:var(--primary);color:#fff}.annotation-cancel{background:var(--primary-soft);color:var(--primary)}
.annotation-output{position:fixed;right:22px;top:22px;z-index:45;width:286px;max-height:285px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 36px rgba(30,25,18,.14);padding:12px;display:none}
.annotation-output.show{display:block}
.annotation-output h4{font-size:13px;margin-bottom:8px;color:var(--ink)}
.annotation-output pre{white-space:pre-wrap;font-size:11px;line-height:1.45;color:var(--muted)}
.annotation-output button{margin-top:8px;width:100%;border:0;border-radius:10px;background:var(--primary);color:#fff;padding:9px;font-size:12px;font-weight:680;cursor:pointer}
.copy-fallback{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g>
<g id="i-box"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></g>
<g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
<g id="i-alert"><path d="M10.3 4.6 2.7 18a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
<g id="i-in"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></g>
<g id="i-out"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></g>
<g id="i-cab"><path d="M4 3h16v18H4z"/><path d="M4 11h16"/><path d="M9 7h.01"/><path d="M9 15h.01"/></g>
<g id="i-plus"><path d="M12 5v14"/><path d="M5 12h14"/></g>
<g id="i-home"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></g>
<g id="i-list"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></g>
<g id="i-scan"><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M7 12h10"/></g>
<g id="i-user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></g>
</defs></svg>
<button class="annotate-toggle" id="annotateToggle">批注模式</button>
<div class="annotation-panel" id="annotationPanel"><b id="annotationTarget">批注</b><textarea id="annotationText" placeholder="写下这里要怎么改"></textarea><div class="annotation-actions"><button class="annotation-cancel" id="annotationCancel">取消</button><button class="annotation-save" id="annotationSave">保存批注</button></div></div>
<div class="annotation-output" id="annotationOutput"><h4>批注已记录</h4><pre id="annotationList"></pre><button id="copyAnnotations">复制给小洛</button></div>
<div class="phone"><div class="screen"><div class="status"><b>9:41</b><span>5G&nbsp;&nbsp;82%</span></div><div class="top annotatable" data-annotation="顶部标题与搜索入口"><div class="title"><b>家庭仓库</b><span>状态总览</span></div><button class="search-dot" aria-label="搜索"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></button></div><div class="scroll"><main class="content">
<section class="summary annotatable" data-annotation="首页核心：库存状态总览卡"><div class="summary-main"><div class="summary-icon"><svg viewBox="0 0 24 24"><use href="#i-box"/></svg></div><div class="summary-text"><strong>128</strong><span>件物品 · 今日整体稳定</span></div></div><div class="health-row"><div class="health ok annotatable" data-annotation="正常库存状态"><svg viewBox="0 0 24 24"><use href="#i-box"/></svg><span>正常 120</span></div><div class="health warn annotatable" data-annotation="临期提醒状态"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg><span>临期 3</span></div><div class="health bad annotatable" data-annotation="低库存状态"><svg viewBox="0 0 24 24"><use href="#i-alert"/></svg><span>低库存 5</span></div></div></section>
<section class="flow annotatable" data-annotation="今日流动：替代原趋势带"><div class="flow-head"><b>今日流动</b><span>按库存流水汇总</span></div><div class="flow-row"><div class="flow-item in"><svg viewBox="0 0 24 24"><use href="#i-in"/></svg><b>+12</b><span>入库</span></div><div class="flow-item out"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg><b>-3</b><span>出库</span></div><div class="flow-item net"><svg viewBox="0 0 24 24"><use href="#i-box"/></svg><b>+9</b><span>净增</span></div></div></section>
<section class="actions annotatable" data-annotation="图标快捷操作栏：新增、入库、出库"><button class="action" aria-label="新增"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>新增</span></button><button class="action" aria-label="入库"><svg viewBox="0 0 24 24"><use href="#i-in"/></svg><span>入库</span></button><button class="action" aria-label="出库"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg><span>出库</span></button></section>
<section class="attention annotatable" data-annotation="风险清单：只保留最该处理的事项"><div class="attention-head"><b>需要处理</b><span>全部</span></div><div class="row annotatable" data-annotation="临期物品提醒"><span class="row-icon warn"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg></span><div class="row-body"><b>温莎牛顿 24 色颜料</b><span>30 天后到期 · 蓝色颜料盒</span></div><span class="row-mark">30天</span></div><div class="row annotatable" data-annotation="低库存物品提醒"><span class="row-icon bad"><svg viewBox="0 0 24 24"><use href="#i-alert"/></svg></span><div class="row-body"><b>7 号电池</b><span>只剩 1 节 · 建议补货</span></div><span class="row-mark">低</span></div></section>
</main></div><div class="bottom-nav"><div class="nav-capsule annotatable" data-annotation="底部浮动胶囊导航"><button class="nav-item on"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg></button><button class="nav-item"><svg viewBox="0 0 24 24"><use href="#i-cab"/></svg></button><button class="nav-scan"><svg viewBox="0 0 24 24"><use href="#i-scan"/></svg></button><button class="nav-item"><svg viewBox="0 0 24 24"><use href="#i-list"/></svg></button><button class="nav-item"><svg viewBox="0 0 24 24"><use href="#i-user"/></svg></button></div></div></div></div>
<script>(function(){const $=s=>document.querySelector(s);const toggle=$('#annotateToggle'),panel=$('#annotationPanel'),target=$('#annotationTarget'),text=$('#annotationText'),output=$('#annotationOutput'),list=$('#annotationList'),copyBtn=$('#copyAnnotations');let active=false,current=null;const notes=[];function payload(){return '页面批注：\n'+notes.map((n,i)=>`${i+1}. [${n.area}] ${n.note}`).join('\n')}function refresh(){if(!notes.length){output.classList.remove('show');return}list.textContent=payload();output.classList.add('show');copyBtn.textContent='复制给小洛'}toggle.onclick=function(){active=!active;document.body.classList.toggle('annotating',active);toggle.textContent=active?'退出批注':'批注模式';if(!active){panel.classList.remove('show');current=null}};document.querySelectorAll('.annotatable').forEach(el=>{el.addEventListener('click',function(e){if(!active)return;e.preventDefault();e.stopPropagation();current=el;target.textContent='批注：'+(el.dataset.annotation||el.className);text.value='';panel.classList.add('show');text.focus()},true)});$('#annotationCancel').onclick=function(){panel.classList.remove('show');current=null};$('#annotationSave').onclick=function(){const note=text.value.trim();if(!current||!note)return;notes.push({area:current.dataset.annotation||current.className,note});panel.classList.remove('show');current=null;refresh()};copyBtn.onclick=async function(){const value=payload();try{await navigator.clipboard.writeText(value);this.textContent='已复制，发给小洛'}catch(e){let ta=$('#copyFallback');if(!ta){ta=document.createElement('textarea');ta.id='copyFallback';ta.className='copy-fallback';document.body.appendChild(ta)}ta.value=value;ta.focus();ta.select();const ok=document.execCommand&&document.execCommand('copy');this.textContent=ok?'已复制，发给小洛':'请手动复制上方文本'}}})();</script>
</body>
</html>
