<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭仓库 · 物品</title><style>

olumn}.detail.show,.editor.show{display:flex}.hero{padding:16px;border:1px solid #e2e5fa;border-radius:20px;background:var(--psoft)}.hero small{font-size:10px;color:var(--p)}.hero h2{margin:7px 0 14px;font-size:19px}.stock{display:flex;align-items:end;gap:5px}.stock b{font-size:32px;line-height:1}.stock span{font-size:12px;color:var(--muted)}.expiry{display:block;margin-top:9px;color:var(--warn)!important}.info{margin-top:12px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:2px 14px}.info div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.info div:last-child{border:0}.info span{color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{height:42px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--p);font-size:12px;cursor:pointer}.actions .danger{grid-column:1/-1;color:var(--bad);background:#fff7f7}.record-title{margin-top:16px;font-size:13px;font-weight:650}.records{margin-top:7px}.record{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 11px;margin-bottom:7px;font-size:11px}.record b{font-weight:650}.record span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.editor-top{height:64px;padding:18px 18px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(235,231,223,.7)}.editor-top h2{font-size:16px}.form{padding:5px 18px 28px;overflow:auto}.form-label{display:block;margin:14px 0 6px;font-size:11px;font-weight:650}.field,.select{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:#fcfaf6;padding:0 11px;color:var(--ink);font:12px inherit;outline:0}.field:focus,.select:focus{border-color:var(--p)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{margin-top:12px;padding:10px 11px;border-radius:13px;background:var(--psoft);color:var(--p);font-size:10px;line-height:1.45}.save{width:100%;margin-top:20px;height:44px;border:0;border-radius:13px;background:var(--p);color:#fff;font:650 13px inherit}.sheet-backdrop{position:absolute;inset:0;z-index:15;display:none;background:rgba(27,25,35,.28)}.sheet-backdrop.show{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;padding:11px 18px 24px;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 34px rgba(30,25,18,.13)}.handle{width:34px;height:4px;margin:0 auto 14px;border-radius:9px;background:#ded9d1}.sheet h3{font-size:16px}.sheet p{margin-top:5px;color:var(--muted);font-size:11px}.sheet-actions{display:flex;gap:8px;margin-top:12px}.sheet-actions button{flex:1;height:42px;border:0;border-radius:12px;font:650 12px inherit}.secondary{background:var(--psoft);color:var(--p)}.primary{background:var(--p);color:#fff}.annotate-toggle{position:fixed;right:22px;bottom:22px;z-index:40;border:0;border-radius:999px;background:var(--p);color:#fff;padding:12px 16px;font-size:13px;font-weight:650;box-shadow:0 10px 24px rgba(111,125,204,.2)}.annotating .annotatable{outline:2px dashed rgba(111,125,204,.42);outline-offset:3px}.annotation-panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:min(360px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 46px rgba(30,25,18,.18);padding:14px;display:none}.annotation-panel.show{display:block}.annotation-panel b{display:block;font-size:13px;margin-bottom:8px}.annotation-panel textarea{width:100%;height:84px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px inherit;color:var(--ink);outline:0;background:#fcfaf6}.annotation-actions{display:flex;gap:8px;margin-top:10px}.annotation-actions button{flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:650}.annotation-save{background:var(--p);color:#fff}.annotation-cancel{background:var(--psoft);color:var(--p)}.annotation-output{position:fixed;right:22px;top:22px;z-index:45;width:286px;max-height:285px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 36px rgba(30,25,18,.14);padding:12px;display:none}.annotation-output.show{display:block}.annotation-output h4{font-size:13px;margin-bottom:8px}.annotation-output pre{white-space:pre-wrap;font:11px/1.45 inherit;color:var(--muted)}.annotation-output button{margin-top:8px;width:100%;border:0;border-radius:10px;background:var(--p);color:#fff;padding:9px;font-size:12px}@media(max-width:430px){body{display:flex;padding:0;background:#171824}.phone{width:320px;height:682px}.annotate-toggle{right:16px;bottom:16px}.annotation-output{display:none!important}}
</style></head><body><svg style="display:none"><defs><g id="box"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></g><g id="search"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g><g id="plus"><path d="M12 5v14M5 12h14"/></g><g id="home"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></g><g id="scan"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 12h10"/></g><g id="back"><path d="m15 18-6-6 6-6"/></g><g id="arrow"><path d="m9 18 6-6-6-6"/></g><g id="list"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></g><g id="user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></g></defs></svg><button class="annotate-toggle" id="annotateToggle">批注模式</button><div class="annotation-panel" id="annotationPanel"><b id="annotationTarget">批注</b><textarea id="annotationText" placeholder="写下这里要怎么改"></textarea><div class="annotation-actions"><button class="annotation-cancel" id="annotationCancel">取消</button><button class="annotation-save" id="annotationSave">保存批注</button></div></div><div class="annotation-output" id="annotationOutput"><h4>批注已记录</h4><pre id="annotationList"></pre><button id="copyAnnotations">复制给小洛</button></div><div class="phone"><main class="screen"><section id="listPage"><div class="status"><span>9:41</span><span>5G　82%</span></div><header class="top annotatable" data-annotation="物品页标题与新增入口"><h1>物品</h1><button class="icon-btn add" id="addItem"><svg><use href="#plus"/></svg></button></header><div class="scroll"><div class="search annotatable" data-annotation="物品搜索入口"><svg><use href="#search"/></svg><span>搜索物品、分类、位置</span></div><div class="chips annotatable" data-annotation="物品分类筛选"><button class="chip active">全部</button><button class="chip">画材</button><button class="chip">工具</button><button class="chip">纸张</button><button class="chip">日用品</button></div><div class="section-head"><b>全部物品</b><span id="itemCount">4 件</span></div><section class="items annotatable" data-annotation="物品列表：名称、位置和状态" id="itemList"></section></div><nav class="nav"><div class="navin annotatable" data-annotation="底部浮动胶囊导航"><button><svg><use href="#home"/></svg></button><button class="active"><svg><use href="#box"/></svg></button><button class="scan"><svg><use href="#scan"/></svg></button><button><svg><use href="#list"/></svg></button><button><svg><use href="#user"/></svg></button></div></nav></section><section class="detail" id="detailPage"><div class="status"><span>9:41</span><span>5G　82%</span></div><header class="top annotatable" data-annotation="物品详情标题与返回"><button class="icon-btn" id="detailBack"><svg><use href="#back"/></svg></button><h1>物品详情</h1></header><div class="scroll"><section class="hero annotatable" data-annotation="物品核心信息与库存"><small id="heroMeta"></small><h2 id="heroName"></h2><div class="stock"><b id="stockNum"></b><span id="stockUnit"></span></div><small class="expiry">30 天后到期</small></section><section class="info annotatable" data-annotation="物品信息：分类、位置、提醒"><div><span>分类</span><b id="infoCategory"></b></div><div><span>位置</span><b id="infoLocation"></b></div><div><span>低库存提醒</span><b id="infoLimit"></b></div><div><span>到期日期</span><b>2026-08-11</b></div></section><section class="actions annotatable" data-annotation="物品操作：消耗、补货、移动、编辑"><button data-action="consume">消耗</button><button data-action="replenish">补货</button><button data-action="move">移动位置</button><button data-action="edit">编辑物品</button><button class="danger" data-action="delete">删除物品</button></section><div class="record-title">最近操作</div><div class="records annotatable" data-annotation="物品最近操作记录" id="records"></div></div></section><section class="editor annotatable" data-annotation="新增与编辑物品页" id="editorPage"><header class="editor-top"><button class="icon-btn" id="editorBack"><svg><use href="#back"/></svg></button><h2 id="editorTitle">新增物品</h2></header><form class="form" id="itemForm"><label class="form-label">物品名称</label><input class="field" id="formName" required placeholder="例如：温莎牛顿 24 色颜料"><div class="pair"><div><label class="form-label">分类</label><select class="select" id="formCategory"><option>画材</option><option>工具</option><option>纸张</option><option>日用品</option></select></div><div><label class="form-label">存放位置</label><select class="select" id="formLocation"><option>书房 A 柜 / 蓝盒</option><option>书房 A 柜 / 2层</option><option>工具柜 / 1层</option></select></div></div><div class="pair"><div><label class="form-label">当前库存</label><input class="field" id="formQty" type="number" min="0" required></div><div><label class="form-label">单位</label><select class="select" id="formUnit"><option>盒</option><option>件</option><option>卷</option><option>包</option></select></div></div><div class="pair"><div><label class="form-label">低库存提醒</label><input class="field" id="formLimit" type="number" min="0" required></div><div><label class="form-label">保质期</label><input class="field" type="date" value="2026-08-11"></div></div><div class="hint">位置和分类均需选择末级节点；保存后可继续消耗、补货或移动位置。</div><button class="save">保存物品</button></form></section><div class="sheet-backdrop" id="sheet"><section class="sheet"><div class="handle"></div><h3 id="sheetTitle"></h3><p id="sheetHint"></p><label class="form-label" id="sheetLabel">数量</label><input class="field" id="sheetQty" type="number" min="1" value="1"><div id="moveFields" hidden><label class="form-label">新位置</label><select class="select" id="moveLocation"><option>工具柜 / 1层</option><option>书房 A 柜 / 2层</option><option>书房 A 柜 / 蓝盒</option></select></div><div class="sheet-actions"><button class="secondary" id="sheetCancel">取消</button><button class="primary" id="sheetConfirm">确认</button></div></section></div></main></div><script>
const $=s=>document.querySelector(s);let items=[{name:'温莎牛顿 24 色颜料',category:'画材',location:'书房 A 柜 / 蓝盒',qty:3,unit:'盒',limit:2,tag:'30天',warn:1,records:[['入库 2 盒','今天 10:20 · 从采购清单入库']]},{name:'8K 水彩纸',category:'纸张',location:'书房 A 柜 / 2层',qty:1,unit:'包',limit:2,tag:'低',warn:1,records:[]},{name:'3M 双面胶',category:'工具',location:'工具柜 / 1层',qty:4,unit:'卷',limit:1,records:[]},{name:'素描纸',category:'纸张',location:'书房 A 柜 / 白盒',qty:20,unit:'包',limit:3,records:[]}],current=0,editing=null,action='';function renderList(){$('#itemCount').textContent=items.length+' 件';$('#itemList').innerHTML=items.map((x,i)=>`<button class="item" data-item="${i}"><span class="item-icon ${x.warn?'warn':i===2?'ok':''}"><svg><use href="#box"/></svg></span><span class="item-main"><b>${x.name}</b><span>${x.category} · ${x.location}</span></span><span class="tag ${x.warn?'warn':''}">${x.tag||'×'+x.qty}</span><svg class="arrow"><use href="#arrow"/></svg></button>`).join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openDetail(+b.dataset.item))}function openDetail(i){current=i;let x=items[i];$('#listPage').style.display='none';$('#detailPage').classList.add('show');$('#heroMeta').textContent=x.category+' · '+x.location;$('#heroName').textContent=x.name;$('#stockNum').textContent=x.qty;$('#stockUnit').textContent=x.unit;$('#infoCategory').textContent=x.category;$('#infoLocation').textContent=x.location;$('#infoLimit').textContent=x.limit+' '+x.unit;$('#records').innerHTML=(x.records.length?x.records:[['暂无库存记录','完成消耗、补货或移动后会显示在这里']]).map(r=>`<div class="record"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}function closeDetail(){$('#detailPage').classList.remove('show');$('#listPage').style.display='block';renderList()}function openEditor(i){editing=i;let x=i===null?{name:'',category:'画材',location:'书房 A 柜 / 蓝盒',qty:1,unit:'盒',limit:1}:items[i];$('#editorTitle').textContent=i===null?'新增物品':'编辑物品';$('#formName').value=x.name;$('#formCategory').value=x.category;$('#formLocation').value=x.location;$('#formQty').value=x.qty;$('#formUnit').value=x.unit;$('#formLimit').value=x.limit;$('#editorPage').classList.add('show')}function closeEditor(){$('#editorPage').classList.remove('show')}function openSheet(a){action=a;let x=items[current],move=a==='move';$('#sheetTitle').textContent=move?'移动位置':a==='consume'?'消耗库存':'补货入库';$('#sheetHint').textContent=move?'选择新的末级存放位置':`当前库存：${x.qty} ${x.unit}`;$('#sheetLabel').hidden=move;$('#sheetQty').hidden=move;$('#moveFields').hidden=!move;$('#sheetQty').value=1;$('#sheet').classList.add('show')}function closeSheet(){$('#sheet').classList.remove('show')}$('#addItem').onclick=()=>openEditor(null);$('#detailBack').onclick=closeDetail;$('#editorBack').onclick=closeEditor;$('#itemForm').onsubmit=e=>{e.preventDefault();let x={name:$('#formName').value.trim(),category:$('#formCategory').value,location:$('#formLocation').value,qty:+$('#formQty').value,unit:$('#formUnit').value,limit:+$('#formLimit').value,records:[['创建物品','刚刚 · 已完成基础信息录入']]};if(editing===null){items.unshift(x);current=0}else{items[editing]={...items[editing],...x}}closeEditor();renderList()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='edit')openEditor(current);else if(a==='delete'){if(confirm('删除该物品？')){items.splice(current,1);closeDetail()}}else openSheet(a)});$('#sheetCancel').onclick=closeSheet;$('#sheetConfirm').onclick=()=>{let x=items[current],now='刚刚';if(action==='consume'){let q=+$('#sheetQty').value;if(!q||q>x.qty)return;x.qty-=q;x.records.unshift(['消耗 '+q+' '+x.unit,now+' · 剩余 '+x.qty+' '+x.unit]);x.warn=x.qty<=x.limit}else if(action==='replenish'){let q=+$('#sheetQty').value;if(!q)return;x.qty+=q;x.records.unshift(['补货 '+q+' '+x.unit,now+' · 当前 '+x.qty+' '+x.unit]);x.warn=false}else{x.location=$('#moveLocation').value;x.records.unshift(['移动位置',now+' · 已移至 '+x.location])}closeSheet();openDetail(current)};let active=false,currentNote=null,notes=[];$('#annotateToggle').onclick=()=>{active=!active;document.body.classList.toggle('annotating',active);$('#annotateToggle').textContent=active?'退出批注':'批注模式'};document.addEventListener('click',e=>{let el=e.target.closest('.annotatable');if(!active||!el)return;e.preventDefault();e.stopPropagation();currentNote=el;$('#annotationTarget').textContent='批注：'+el.dataset.annotation;$('#annotationText').value='';$('#annotationPanel').classList.add('show')},true);$('#annotationCancel').onclick=()=>$('#annotationPanel').classList.remove('show');$('#annotationSave').onclick=()=>{let note=$('#annotationText').value.trim();if(!currentNote||!note)return;notes.push({area:currentNote.dataset.annotation,note});$('#annotationPanel').classList.remove('show');$('#annotationList').textContent='页面批注：\n'+notes.map((n,i)=>`${i+1}. [${n.area}] ${n.note}`).join('\n');$('#annotationOutput').classList.add('show')};$('#copyAnnotations').onclick=async function(){try{await navigator.clipboard.writeText($('#annotationList').textContent);this.textContent='已复制，发给小洛'}catch{this.textContent='请手动复制上方文字'}};renderList();
</script></body></html>
