:root{--p:#6f7dcc;--psoft:#f1f3ff;--bg:#f7f5f0;--card:#fffefb;--ink:#30313a;--muted:#85838a;--line:#ebe7df;--ok:#77a99c;--warn:#d9a16f;--bad:#d77778;--shadow:0 6px 22px rgba(74,65,52,.07)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8e5e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.phone{width:390px;height:844px;padding:9px;background:#24242e;border-radius:34px;box-shadow:0 26px 60px rgba(62,57,67,.32)}.screen{height:100%;overflow:hidden;border-radius:26px;background:linear-gradient(#fcfbf8,var(--bg));display:flex;flex-direction:column}.status{height:28px;padding:0 19px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}.top{height:60px;padding:0 16px;display:flex;align-items:center;gap:8px}.top h1{margin:0;font-size:20px;font-weight:600}.icon-btn{width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:var(--p);display:grid;place-items:center}.icon-btn.add{margin-left:auto;background:var(--psoft)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.scroll{flex:1;overflow:auto;padding:0 16px 90px}.search{height:48px;border:1px solid var(--line);border-radius:15px;background:#fcfaf6;color:var(--muted);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px}.search svg{width:19px}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0 13px}.chip{height:34px;border:0;border-radius:17px;padding:0 14px;white-space:nowrap;background:#eeeae3;color:#69656c;font-size:12px}.chip.active{background:var(--psoft);color:var(--p);font-weight:600}.section-head{display:flex;align-items:center;justify-content:space-between;padding:7px 0 9px}.section-head b{font-size:16px;font-weight:600}.section-head span{font-size:12px;color:var(--muted)}.items{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 14px}.item{width:100%;min-height:72px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;text-align:left;color:var(--ink)}.item:last-child{border-bottom:0}.item-icon{width:42px;height:42px;flex:none;border-radius:14px;background:var(--psoft);color:var(--p);display:grid;place-items:center}.item-icon.warn{background:#fbf2e8;color:var(--warn)}.item-icon.ok{background:#eff7f3;color:var(--ok)}.item-main{min-width:0;flex:1}.item-main b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main span{display:block;margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:11px;padding:6px 8px;border-radius:9px;background:#eff7f3;color:var(--ok)}.tag.warn{background:#fbf2e8;color:var(--warn)}.arrow{color:var(--muted)}.nav{height:76px;margin-top:-76px;padding-top:14px;display:flex;justify-content:center;background:linear-gradient(transparent,var(--bg) 45%)}.navin{height:52px;padding:5px;border:1px solid var(--line);background:#fffefbe8;box-shadow:var(--shadow);border-radius:999px;display:flex;gap:4px}.nav button{width:46px;border:0;background:transparent;color:var(--muted);border-radius:999px;display:grid;place-items:center}.nav button.active{background:var(--psoft);color:var(--p)}.nav .scan{height:52px;margin-top:-8px;background:var(--p);color:#fff;border-radius:18px}.detail{display:none;height:100%;flex-direction:column}.detail.show{display:flex}.back{font-size:0}.hero{padding:20px;border:1px solid #e2e5fa;border-radius:24px;background:var(--psoft)}.hero small{font-size:12px;color:var(--p)}.hero h2{margin:8px 0 18px;font-size:22px;font-weight:600}.stock{display:flex;align-items:end;gap:5px}.stock b{font-size:38px;line-height:1;font-weight:600}.stock span{font-size:13px;color:var(--muted)}.expiry{display:block;margin-top:10px;color:var(--warn)!important}.info{margin-top:16px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:2px 14px}.info div{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.info div:last-child{border:0}.info span{color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{height:48px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--p);font-size:14px}.actions .danger{grid-column:1/-1;color:var(--bad);background:#fff7f7}.record{margin-top:20px;font-size:14px;font-weight:600}.record-card{margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;font-size:12px}.record-card b{font-weight:600}.record-card span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.annotate-toggle{position:fixed;right:22px;bottom:22px;z-index:40;border:0;border-radius:999px;background:var(--p);color:#fff;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:0 10px 24px rgba(111,125,204,.2)}.annotating .annotatable{outline:2px dashed rgba(111,125,204,.42);outline-offset:3px}.annotation-panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:min(360px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 46px rgba(30,25,18,.18);padding:14px;display:none}.annotation-panel.show{display:block}.annotation-panel b{display:block;font-size:13px;margin-bottom:8px}.annotation-panel textarea{width:100%;height:84px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px inherit;color:var(--ink);outline:none;background:#fcfaf6}.annotation-panel textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--psoft)}.annotation-actions{display:flex;gap:8px;margin-top:10px}.annotation-actions button{flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:600}.annotation-save{background:var(--p);color:#fff}.annotation-cancel{background:var(--psoft);color:var(--p)}.annotation-output{position:fixed;right:22px;top:22px;z-index:45;width:286px;max-height:285px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 36px rgba(30,25,18,.14);padding:12px;display:none}.annotation-output.show{display:block}.annotation-output h4{font-size:13px;margin:0 0 8px}.annotation-output pre{white-space:pre-wrap;font:11px/1.45 inherit;color:var(--muted)}.annotation-output button{margin-top:8px;width:100%;border:0;border-radius:10px;background:var(--p);color:#fff;padding:9px;font-size:12px}@media(max-width:430px){body{display:block;background:#24242e}.phone{width:100vw;height:100vh;padding:0;border-radius:0}.screen{border-radius:0}.annotate-toggle{right:16px;bottom:16px}}
</style></head>

<button class="annotate-toggle" id="annotateToggle">批注模式</button><div class="annotation-panel" id="annotationPanel"><b id="annotationTarget">批注</b><textarea id="annotationText" placeholder="写下这里要怎么改"></textarea><div class="annotation-actions"><button class="annotation-cancel" id="annotationCancel">取消</button><button class="annotation-save" id="annotationSave">保存批注</button></div></div><div class="annotation-output" id="annotationOutput"><h4>批注已记录</h4><pre id="annotationList"></pre><button id="copyAnnotations">复制给小洛</button></div>
<div class="phone"><section class="screen" id="listPage"><div class="status"><span>9:41</span><span>5G　82%</span></div><header class="top annotatable" data-annotation="物品页标题与新增入口"><h1>物品</h1><button class="icon-btn add" aria-label="新增物品"><svg><use href="#plus"/></svg></button></header><main class="scroll"><div class="search annotatable" data-annotation="物品搜索入口"><svg><use href="#search"/></svg><span>搜索物品、分类、位置</span></div><div class="chips annotatable" data-annotation="物品分类筛选"><button class="chip active">全部</button><button class="chip">画材</button><button class="chip">工具</button><button class="chip">纸张</button><button class="chip">日用品</button></div><div class="section-head"><b>全部物品</b><span>128 件</span></div><section class="items annotatable" data-annotation="物品列表：名称、位置和状态"><button class="item" onclick="openDetail()"><span class="item-icon"><svg><use href="#box"/></svg></span><span class="item-main"><b>温莎牛顿 24 色颜料</b><span>画材 · 书房 A 柜 / 蓝盒</span></span><span class="tag warn">30天</span><svg class="arrow"><use href="#arrow"/></svg></button><button class="item" onclick="openDetail()"><span class="item-icon warn"><svg><use href="#box"/></svg></span><span class="item-main"><b>8K 水彩纸</b><span>纸张 · 书房 A 柜 / 2层</span></span><span class="tag warn">低</span><svg class="arrow"><use href="#arrow"/></svg></button><button class="item"><span class="item-icon ok"><svg><use href="#box"/></svg></span><span class="item-main"><b>3M 双面胶</b><span>工具 · 工具柜 / 1层</span></span><span class="tag">×4</span><svg class="arrow"><use href="#arrow"/></svg></button><button class="item"><span class="item-icon"><svg><use href="#box"/></svg></span><span class="item-main"><b>素描纸</b><span>纸张 · 书房 A 柜 / 白盒</span></span><span class="tag">×20</span><svg class="arrow"><use href="#arrow"/></svg></button></section></main><nav class="nav"><div class="navin annotatable" data-annotation="底部浮动胶囊导航"><button><svg><use href="#home"/></svg></button><button class="active"><svg><use href="#box"/></svg></button><button class="scan"><svg><use href="#scan"/></svg></button><button><svg><use href="#list"/></svg></button><button><svg><use href="#user"/></svg></button></div></nav></section>
<section class="screen detail" id="detailPage"><div class="status"><span>9:41</span><span>5G　82%</span></div><header class="top annotatable" data-annotation="物品详情标题与返回"><button class="icon-btn back" onclick="closeDetail()" aria-label="返回"><svg><use href="#back"/></svg></button><h1>物品详情</h1></header><main class="scroll"><section class="hero annotatable" data-annotation="物品核心信息与库存"><small>画材 · 书房 A 柜 / 蓝盒</small><h2>温莎牛顿 24 色颜料</h2><div class="stock"><b>3</b><span>盒</span></div><small class="expiry">30 天后到期</small></section><section class="info annotatable" data-annotation="物品信息：分类、位置、提醒"><div><span>分类</span><b>画材</b></div><div><span>位置</span><b>书房 A 柜 / 蓝盒</b></div><div><span>低库存提醒</span><b>2 盒</b></div><div><span>到期日期</span><b>2026-08-11</b></div></section><section class="actions annotatable" data-annotation="物品操作：消耗、补货、移动、编辑"><button>消耗</button><button>补货</button><button>移动位置</button><button>编辑物品</button><button class="danger">删除物品</button></section><div class="record">最近操作</div><div class="record-card annotatable" data-annotation="物品最近操作记录"><b>入库 2 盒</b><span>今天 10:20 · 从采购清单入库</span></div></main></section></div>
<script>function openDetail(){listPage.style.display='none';detailPage.classList.add('show')}function closeDetail(){detailPage.classList.remove('show');listPage.style.display='flex'}(()=>{const $=s=>document.querySelector(s),toggle=$('#annotateToggle'),panel=$('#annotationPanel'),target=$('#annotationTarget'),input=$('#annotationText'),output=$('#annotationOutput'),list=$('#annotationList'),copy=$('#copyAnnotations');let enabled=false,current;const notes=[];const payload=()=>`页面批注：\n${notes.map((n,i)=>`${i+1}. [${n.area}] ${n.note}`).join('\n')}`;function refresh(){if(!notes.length)return;list.textContent=payload();output.classList.add('show');copy.textContent='复制给小洛'}toggle.onclick=()=>{enabled=!enabled;document.body.classList.toggle('annotating',enabled);toggle.textContent=enabled?'退出批注':'批注模式';if(!enabled){panel.classList.remove('show');current=null}};document.querySelectorAll('.annotatable').forEach(el=>el.addEventListener('click',e=>{if(!enabled)return;e.preventDefault();e.stopPropagation();current=el;target.textContent=`批注：${el.dataset.annotation}`;input.value='';panel.classList.add('show');input.focus()},true));$('#annotationCancel').onclick=()=>{panel.classList.remove('show');current=null};$('#annotationSave').onclick=()=>{const note=input.value.trim();if(!current||!note)return;notes.push({area:current.dataset.annotation,note});panel.classList.remove('show');current=null;refresh()};copy.onclick=async()=>{try{await navigator.clipboard.writeText(payload());copy.textContent='已复制，发给小洛'}catch{list.textContent=payload();copy.textContent='请手动复制上方文字'}}})()</script>
