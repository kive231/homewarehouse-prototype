<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家庭仓库首页 — 紫调重设计</title>
<style>
:root{
  --bg:#f8f9fa; --card:#ffffff; --ink:#2d2d3a; --muted:#b0b0b8;
  --line:#eeeef0; --brand:#5b6abf; --brand-light:#8b94d6; --brand-soft:#eef0fb;
  --green:#5baa9e; --orange:#e8a87c; --red:#d9626e;
  --shadow-sm:0 1px 3px rgba(0,0,0,.02); --shadow-md:0 2px 8px rgba(91,106,191,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#ded9d1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--ink)}
button{font-family:inherit}.phone{width:310px;height:650px;background:#171824;border-radius:24px;padding:10px;box-shadow:0 24px 64px rgba(20,20,40,.22),inset 0 0 0 1px rgba(255,255,255,.04);position:relative}.phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:72px;height:5px;background:#27293a;border-radius:99px;z-index:5}.screen{width:100%;height:100%;background:var(--bg);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10.5px;color:var(--muted);flex-shrink:0;background:rgba(248,249,250,.9);font-weight:500}.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}.content{padding:14px 18px 78px;display:flex;flex-direction:column;gap:14px}.top{padding-top:2px}.home-title{font-size:22px;font-weight:600;letter-spacing:-.4px;color:var(--ink)}.home-sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}.hero{border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-light));padding:17px 16px 15px;color:#fff;box-shadow:0 2px 8px rgba(91,106,191,.16);overflow:hidden;position:relative}.hero::after{content:"";position:absolute;right:-18px;top:-28px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.12)}.hero-label{font-size:11px;opacity:.82;font-weight:400;position:relative;z-index:1}.hero-main{display:flex;align-items:flex-end;gap:7px;margin-top:8px;position:relative;z-index:1}.hero-num{font-size:38px;line-height:.92;font-weight:600;letter-spacing:-1.3px}.hero-unit{font-size:12px;margin-bottom:3px;opacity:.9;font-weight:500}.hero-meta{display:flex;gap:12px;margin-top:12px;font-size:11px;opacity:.88;position:relative;z-index:1}.search{height:40px;border-radius:10px;background:#f0f2f5;color:#969aa4;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;font-weight:400}.search svg{width:16px;height:16px;color:#86909c}.todo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.todo-card{border:0;border-radius:10px;padding:10px 8px;text-align:left;background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer}.todo-card b{display:block;font-size:20px;font-weight:600;letter-spacing:-.5px}.todo-card span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.todo-card.orange{background:#fff7f1;color:var(--orange)}.todo-card.red{background:#fff2f3;color:var(--red)}.todo-card.green{background:#eff8f6;color:var(--green)}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;background:var(--card);border-radius:10px;min-height:62px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink)}.action-icon{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}.action-icon svg{width:16px;height:16px}.action b{font-size:12px;font-weight:600}.section-head{display:flex;align-items:center;justify-content:space-between}.section-head h3{font-size:14px;font-weight:600;color:var(--ink)}.section-head span{font-size:11px;color:var(--brand);font-weight:500}.shortcut-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shortcut{height:48px;border-radius:10px;background:var(--card);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);font-size:10px;font-weight:500}.shortcut i{width:7px;height:7px;border-radius:50%;background:var(--brand);display:block}.list{display:flex;flex-direction:column}.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border-bottom:0}.item-ico{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}.item-ico svg{width:15px;height:15px}.item-body{flex:1;min-width:0}.item-body b{display:block;font-size:12.5px;font-weight:500;color:var(--ink)}.item-body span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.item-tag{font-size:10px;font-weight:500;color:var(--muted);white-space:nowrap}.item-tag.orange{color:var(--orange)}.item-tag.red{color:var(--red)}.bottom-nav{height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding-bottom:4px;background:linear-gradient(180deg,rgba(248,249,250,0),rgba(248,249,250,.94) 38%)}.nav-capsule{display:flex;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-radius:99px;box-shadow:var(--shadow-md);padding:4px}.nav-item{width:48px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:99px;cursor:pointer;border:none;background:none;color:var(--muted);font-weight:500;position:relative}.nav-item.on{color:var(--brand)}.nav-item.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--brand)}.nav-item svg{width:18px;height:18px}.nav-scan{width:48px;height:48px;border-radius:50%;margin:-6px 4px;background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(91,106,191,.22);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}.nav-scan svg{width:22px;height:22px}.annotate-toggle{position:fixed;right:22px;bottom:22px;z-index:40;border:none;border-radius:999px;background:var(--brand);color:#fff;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(91,106,191,.18);cursor:pointer}.annotating .annotatable{outline:2px dashed rgba(91,106,191,.36);outline-offset:3px}.annotating .annotatable:hover{outline-color:var(--brand);background-image:linear-gradient(rgba(91,106,191,.05),rgba(91,106,191,.05))}.annotation-pin{display:none}.annotation-panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:min(360px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 46px rgba(30,25,18,.18);padding:14px;display:none}.annotation-panel.show{display:block}.annotation-panel b{display:block;font-size:13px;color:var(--ink);margin-bottom:8px}.annotation-panel textarea{width:100%;height:84px;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;background:#f8f9fa}.annotation-panel textarea:focus{border-color:var(--brand)}.annotation-actions{display:flex;gap:8px;margin-top:10px}.annotation-actions button{flex:1;border:none;border-radius:10px;padding:10px;font-size:12px;font-weight:600;cursor:pointer}.annotation-save{background:var(--brand);color:#fff}.annotation-cancel{background:var(--brand-soft);color:var(--brand)}.annotation-output{position:fixed;right:22px;top:22px;z-index:45;width:270px;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(30,25,18,.14);padding:12px;display:none}.annotation-output.show{display:block}.annotation-output h4{font-size:13px;margin-bottom:8px;color:var(--ink)}.annotation-output pre{white-space:pre-wrap;font-size:11px;line-height:1.45;color:var(--muted)}.annotation-output button{margin-top:8px;width:100%;border:none;border-radius:8px;background:var(--brand);color:#fff;padding:9px;font-size:12px;font-weight:600;cursor:pointer}.copy-fallback{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
</style>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<g id="ic-scan"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></g>
<g id="ic-plus"><path d="M12 4v16M4 12h16"/></g><g id="ic-search"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></g>
<g id="ic-cab"><path d="M4 3h16a1 1 0 011 1v17H3V4a1 1 0 011-1zM4 11h16"/></g><g id="ic-list"><path d="M8 6h13M8 12h13M8 18h13"/></g>
<g id="ic-user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0113 0"/></g><g id="ic-home"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></g>
<g id="ic-box"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></g>
</defs></svg>
</head>
<body>
<button class="annotate-toggle" id="annotateToggle">批注模式</button>
<div class="annotation-panel" id="annotationPanel"><b id="annotationTarget">批注</b><textarea id="annotationText" placeholder="写下这里要怎么改"></textarea><div class="annotation-actions"><button class="annotation-cancel" id="annotationCancel">取消</button><button class="annotation-save" id="annotationSave">保存批注</button></div></div>
<div class="annotation-output" id="annotationOutput"><h4>批注已记录</h4><pre id="annotationList"></pre><button id="copyAnnotations">复制给小洛</button></div>
<div class="phone"><div class="screen">
<div class="status"><b>9:41</b><span>5G &nbsp;82%</span></div>
<div class="scroll"><div class="content">
  <div class="top annotatable" data-annotation="首页标题"><h1 class="home-title">家庭仓库</h1><p class="home-sub">温润而有序的家庭数字收纳间</p></div>
  <section class="hero annotatable" data-annotation="Hero 紫色渐变卡片"><div class="hero-label">家庭库存总览</div><div class="hero-main"><strong class="hero-num">128</strong><span class="hero-unit">件物品</span></div><div class="hero-meta"><span>3 临期</span><span>5 低库存</span><span>120 正常</span></div></section>
  <div class="search annotatable" data-annotation="搜索栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-search"/></svg><span>搜索物品、位置或分类</span></div>
  <section class="todo-grid annotatable" data-annotation="三块可点待办色块"><button class="todo-card orange"><b>3</b><span>临期提醒</span></button><button class="todo-card red"><b>5</b><span>低库存</span></button><button class="todo-card green"><b>120</b><span>库存正常</span></button></section>
  <section class="quick-actions annotatable" data-annotation="两个主操作块"><button class="action annotatable" data-annotation="新增物品"><span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-plus"/></svg></span><b>新增</b></button><button class="action annotatable" data-annotation="扫码入库"><span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-scan"/></svg></span><b>扫码</b></button></section>
  <section class="annotatable" data-annotation="最近物品列表"><div class="section-head"><h3>最近物品</h3><span>全部›</span></div><div class="list"><div class="item annotatable" data-annotation="最近物品-温莎牛顿"><div class="item-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-box"/></svg></div><div class="item-body"><b>温莎牛顿颜料</b><span>画材 · 书房 A 柜</span></div><div class="item-tag orange">30天</div></div><div class="item annotatable" data-annotation="最近物品-8K水彩纸"><div class="item-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-box"/></svg></div><div class="item-body"><b>8K 水彩纸</b><span>纸张 · 工具柜</span></div><div class="item-tag red">低库</div></div><div class="item"><div class="item-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-box"/></svg></div><div class="item-body"><b>3M 美纹纸胶带</b><span>工具 · B 盒</span></div><div class="item-tag">×4</div></div></div></section>
</div></div>
<div class="bottom-nav"><div class="nav-capsule annotatable" data-annotation="底部浮动导航"><span class="nav-item on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-home"/></svg></span><span class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-list"/></svg></span><span class="nav-scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-scan"/></svg></span><span class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-cab"/></svg></span><span class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-user"/></svg></span></div></div>
</div></div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const toggle=$('#annotateToggle'), panel=$('#annotationPanel'), target=$('#annotationTarget'), text=$('#annotationText'), output=$('#annotationOutput'), list=$('#annotationList'), copyBtn=$('#copyAnnotations');
  let active=false, current=null, notes=[];
  function payload(){return '页面批注：\n'+notes.map((n,i)=>`${i+1}. [${n.area}] ${n.note}`).join('\n');}
  function refresh(){
    if(!notes.length){output.classList.remove('show');return;}
    list.textContent=payload(); output.classList.add('show'); copyBtn.textContent='复制给小洛';
  }
  toggle.onclick=function(){
    active=!active; document.body.classList.toggle('annotating',active);
    toggle.textContent=active?'退出批注':'批注模式';
    if(!active){panel.classList.remove('show');current=null;}
  };
  document.querySelectorAll('.annotatable').forEach(el=>{
    el.addEventListener('click',function(e){
      if(!active)return; e.preventDefault(); e.stopPropagation(); current=el;
      target.textContent='批注：'+(el.dataset.annotation||el.className);
      text.value=''; panel.classList.add('show'); text.focus();
    },true);
  });
  $('#annotationCancel').onclick=function(){panel.classList.remove('show');current=null;};
  $('#annotationSave').onclick=function(){
    const note=text.value.trim(); if(!current||!note)return;
    const rect=current.getBoundingClientRect();
    const pin=document.createElement('div'); pin.className='annotation-pin'; pin.textContent=String(notes.length+1);
    pin.style.left=(rect.left+window.scrollX+8)+'px'; pin.style.top=(rect.top+window.scrollY+8)+'px'; document.body.appendChild(pin);
    notes.push({area:current.dataset.annotation||current.className,note});
    panel.classList.remove('show'); current=null; refresh();
  };
  copyBtn.onclick=async function(){
    const value=payload();
    try{await navigator.clipboard.writeText(value); this.textContent='已复制，发给小洛';}
    catch(e){
      let ta=$('#copyFallback');
      if(!ta){ta=document.createElement('textarea');ta.id='copyFallback';ta.className='copy-fallback';document.body.appendChild(ta);}
      ta.value=value; ta.focus(); ta.select();
      const ok=document.execCommand&&document.execCommand('copy');
      this.textContent=ok?'已复制，发给小洛':'请手动复制上方文本';
    }
  };
})();
</script>
</body>
</html>
