<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家庭仓库首页 — 紫色细节版</title>
<style>
:root{
  --bg:#fbf9f5; --card:#fffefb; --ink:#2c2a28; --muted:#9e968d;
  --line:#ece6db; --brand:#5b6abf; --brand-deep:#4b58a8; --brand-soft:#f0f1fb;
  --amber:#e8956c; --rose:#d9707a; --gold:#c9a24c; --shadow:0 10px 28px rgba(64,55,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#dfdbd4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.phone{width:310px;height:650px;background:#161725;border-radius:30px;padding:10px;box-shadow:0 24px 64px rgba(20,20,40,.25),inset 0 0 0 1px rgba(255,255,255,.04);position:relative}
.phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:72px;height:5px;background:#262a3e;border-radius:99px;z-index:5}
.screen{width:100%;height:100%;background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10.5px;color:var(--muted);flex-shrink:0;background:var(--bg);font-weight:500}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}
.content{display:flex;flex-direction:column;padding-bottom:76px}
.top{padding:20px 22px 0}.home-badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:620}.home-badge svg{width:14px;height:14px}.top h2{font-size:22px;font-weight:620;color:var(--ink);letter-spacing:-.45px;margin-top:10px;line-height:1.18}
.overview{padding:16px 20px 0}.overview-card{background:var(--card);border:1px solid rgba(236,230,219,.78);border-radius:22px;padding:18px 20px 19px;color:var(--ink);box-shadow:var(--shadow);position:relative;overflow:hidden}.overview-card::after{content:"";position:absolute;right:-28px;top:-34px;width:106px;height:106px;border-radius:50%;background:rgba(91,106,191,.08)}.overview-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.overview-title{font-size:12px;color:var(--muted);font-weight:560}.card-icon{width:34px;height:34px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}.card-icon svg{width:18px;height:18px}.total-row{display:flex;align-items:flex-end;gap:8px;margin-top:12px;position:relative;z-index:1}.total{font-size:44px;font-weight:680;color:var(--ink);letter-spacing:-1.2px;line-height:1}.total-label{font-size:12px;color:var(--muted);font-weight:560;margin-bottom:5px}.trend{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--brand-soft);color:var(--brand);padding:6px 10px;font-size:11px;font-weight:600;position:relative;z-index:1}
.indicators{padding:10px 20px 0;display:flex;gap:8px}.indicator{flex:1;background:var(--card);border-radius:18px;padding:13px 12px;box-shadow:0 1px 2px rgba(0,0,0,.02);text-align:center}.indicator .val{font-size:21px;font-weight:660;letter-spacing:-.2px}.indicator .val.amber{color:var(--amber)}.indicator .val.rose{color:var(--rose)}.indicator .val.gold{color:var(--gold)}.indicator .lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:440}
.attention{padding:18px 20px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-head h3{font-size:15px;font-weight:620;color:var(--ink);letter-spacing:-.1px}.section-head span{font-size:11px;color:var(--brand);font-weight:600}.attn-item{background:var(--card);border-radius:16px;padding:15px 16px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.02);display:flex;align-items:center;gap:12px;cursor:pointer}.attn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.attn-dot.amber{background:var(--amber)}.attn-dot.rose{background:var(--rose)}.attn-dot.gold{background:var(--gold)}.attn-body{flex:1}.attn-body b{font-size:14px;font-weight:600;color:var(--ink)}.attn-body span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}.attn-tag{font-size:10px;font-weight:600;padding:5px 10px;border-radius:99px;flex-shrink:0}.attn-tag.amber{background:#fef5f0;color:var(--amber)}.attn-tag.rose{background:#fef2f3;color:var(--rose)}.attn-tag.gold{background:#fdf8ef;color:var(--gold)}
.actions{padding:14px 20px 0;display:flex;gap:8px}.action{flex:1;background:var(--card);border-radius:18px;padding:17px 14px;box-shadow:0 1px 2px rgba(0,0,0,.02);cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:inherit}.action.primary{background:var(--brand);color:#fff;box-shadow:0 10px 22px rgba(91,106,191,.22)}.action .icon{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center}.action .icon.add{background:var(--brand-soft);color:var(--brand)}.action.primary .icon{background:rgba(255,255,255,.18);color:#fff}.action b{font-size:13px;font-weight:600;color:var(--ink)}.action small{font-size:10px;color:var(--muted)}.action.primary b,.action.primary small{color:#fff}.action.primary small{opacity:.76}
.recent{padding:18px 20px 24px}.recent-item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.recent-item:last-child{border-bottom:none}.recent-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.recent-ico.out{background:#fef2f3;color:var(--rose)}.recent-ico.in{background:var(--brand-soft);color:var(--brand)}.recent-ico.move{background:#fdf8ef;color:var(--gold)}.recent-body{flex:1;min-width:0}.recent-body b{font-size:13px;font-weight:600;color:var(--ink)}.recent-body span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}.recent-val{font-size:13px;font-weight:680}.recent-val.down{color:var(--rose)}.recent-val.up{color:var(--brand)}.recent-time{font-size:10px;color:var(--muted);text-align:right;margin-top:2px}
.bottom-nav{height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding-bottom:4px}.nav-capsule{display:flex;align-items:center;background:var(--card);border-radius:99px;box-shadow:0 7px 24px rgba(38,32,24,.08);padding:4px}.nav-item{width:52px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:99px;cursor:pointer;border:none;background:none;color:var(--muted);font-weight:500}.nav-item.on{background:var(--brand-soft);color:var(--brand)}.nav-item svg{width:18px;height:18px}.nav-scan{width:48px;height:48px;border-radius:50%;margin:-6px 4px;background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(91,106,191,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}.nav-scan svg{width:22px;height:22px}
</style>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<g id="ic-scan"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></g>
<g id="ic-plus"><path d="M12 4v16M4 12h16"/></g><g id="ic-minus"><path d="M5 12h14"/></g>
<g id="ic-search"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></g>
<g id="ic-cab"><path d="M4 3h16a1 1 0 011 1v17H3V4a1 1 0 011-1zM4 11h16"/></g>
<g id="ic-list"><path d="M8 6h13M8 12h13M8 18h13"/></g><g id="ic-user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0113 0"/></g>
<g id="ic-edit"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></g>
<g id="ic-home"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></g>
</defs></svg>
</head>
<body>
<div class="phone"><div class="screen">
<div class="status"><b>9:41</b><span>5G &nbsp;82%</span></div>
<div class="scroll"><div class="content">
<div class="top"><div class="home-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-home"/></svg><span>家庭仓库</span></div><h2>下午好，曦曦</h2></div>
<div class="overview"><div class="overview-card"><div class="overview-head"><span class="overview-title">家庭库存总览</span><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-cab"/></svg></div></div><div class="total-row"><div class="total">128</div><div class="total-label">件物品</div></div><div class="trend">本月新增 12 · 消耗 3</div></div></div>
<div class="indicators"><div class="indicator"><div class="val amber">3</div><div class="lbl">临期</div></div><div class="indicator"><div class="val rose">5</div><div class="lbl">低库存</div></div><div class="indicator"><div class="val gold">2</div><div class="lbl">容量满</div></div></div>
<div class="attention"><div class="section-head"><h3>需要关注</h3><span>全部</span></div><div class="attn-item"><div class="attn-dot amber"></div><div class="attn-body"><b>温莎牛顿颜料</b><span>30天后到期 · 书房A柜</span></div><span class="attn-tag amber">临期</span></div><div class="attn-item"><div class="attn-dot rose"></div><div class="attn-body"><b>8K 水彩纸</b><span>只剩 1 件了 · 工具柜</span></div><span class="attn-tag rose">低库存</span></div><div class="attn-item"><div class="attn-dot gold"></div><div class="attn-body"><b>阳台杂物柜</b><span>快装满了 · 95%</span></div><span class="attn-tag gold">整理</span></div></div>
<div class="actions"><button class="action"><div class="icon add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-plus"/></svg></div><b>添加</b><small>物品入库</small></button><button class="action primary"><div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-scan"/></svg></div><b>扫码</b><small>快速录入</small></button></div>
<div class="recent"><div class="section-head"><h3>最近动态</h3><span>记录</span></div><div class="recent-item"><div class="recent-ico out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#ic-minus"/></svg></div><div class="recent-body"><b>温莎牛顿颜料</b><span>消耗 · 书房A柜</span></div><div><div class="recent-val down">−1</div><div class="recent-time">14:30</div></div></div><div class="recent-item"><div class="recent-ico in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#ic-plus"/></svg></div><div class="recent-body"><b>A4 素描纸</b><span>补货 · 书房A柜</span></div><div><div class="recent-val up">+10</div><div class="recent-time">昨天</div></div></div><div class="recent-item"><div class="recent-ico move"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#ic-edit"/></svg></div><div class="recent-body"><b>3M 美纹纸胶带</b><span>移动 · A盒→B盒</span></div><div><div class="recent-time">6月8日</div></div></div></div>
</div></div>
<div class="bottom-nav"><div class="nav-capsule"><span class="nav-item on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-search"/></svg></span><span class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-cab"/></svg></span><span class="nav-scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-scan"/></svg></span><span class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-list"/></svg></span><span class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-user"/></svg></span></div></div>
</div></div>
</body>
</html>
