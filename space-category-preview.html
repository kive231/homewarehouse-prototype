<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭仓库 · 空间与分类</title><style>
:root{--p:#6f7dcc;--ps:#f1f3ff;--bg:#f7f5f0;--card:#fffefb;--ink:#30313a;--muted:#85838a;--line:#ebe7df;--ok:#77a99c;--bad:#d77778;--shadow:0 5px 18px rgba(74,65,52,.055)}*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#e8e5e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.phone{width:320px;height:682px;border-radius:30px;padding:10px;background:#171824;box-shadow:0 28px 72px rgba(20,22,42,.28);position:relative}.phone:before{content:"";position:absolute;top:9px;left:50%;width:74px;height:5px;transform:translateX(-50%);border-radius:9px;background:#2a2d42;z-index:3}.screen{height:100%;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fcfbf8,var(--bg));display:flex;flex-direction:column}.status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:#5f6472;font-size:10.5px}.top{padding:12px 18px 8px;display:flex;align-items:center}.top h1{font-size:21px;line-height:1.12;font-weight:680}.top span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.add{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--p);font-size:24px}.content{flex:1;overflow:auto;padding:4px 18px 82px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#eeeae3;border-radius:14px}.switch button{height:32px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 12px inherit}.switch button.on{background:var(--card);color:var(--p);box-shadow:var(--shadow)}.path{height:34px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--p)}.intro{padding:13px 14px;border:1px solid #e2e5fa;border-radius:18px;background:var(--ps)}.intro b{font-size:14px}.intro span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.list{margin-top:12px;padding:2px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}.swipe:last-child{border:0}.node{position:relative;z-index:1;width:100%;min-height:64px;display:flex;align-items:center;gap:9px;padding:10px 0;border:0;background:var(--card);color:var(--ink);text-align:left;transition:transform .22s ease}.drag{width:14px;color:#b3ada5;font-size:16px;letter-spacing:-3px;line-height:1;cursor:grab}.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:var(--ps);color:var(--p);font-size:17px}.ico.green{background:#eff7f3;color:var(--ok)}.main{flex:1;min-width:0}.main b{display:block;font-size:12.5px;font-weight:650}.main span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.arr{color:var(--muted);font-size:18px}.actions{position:absolute;right:0;top:0;height:100%;display:flex}.actions button{width:48px;border:0;color:#fff;font:600 10px inherit}.edit{background:var(--p)}.delete{background:var(--bad)}.note{margin-top:12px;padding:10px 12px;border-radius:14px;background:#fbf2e8;color:#9b7b58;font-size:10px}.detail{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}.detail b{font-size:13px}.detail span{display:block;margin-top:5px;color:var(--muted);font-size:10px}.nav{height:70px;margin-top:-70px;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(247,245,240,.96) 32%)}.navin{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 14px 30px rgba(35,40,80,.12)}.nav button{width:45px;height:38px;border:0;border-radius:999px;background:transparent;color:var(--muted)}.nav .on{background:var(--ps);color:var(--p)}.nav .scan{width:49px;height:49px;margin:-7px 3px;border-radius:18px;background:var(--p);color:#fff}.annotate{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;padding:12px 16px;background:var(--p);color:#fff;font:600 13px inherit;box-shadow:0 10px 24px rgba(111,125,204,.2)}.annotating [data-note]{outline:2px dashed rgba(111,125,204,.42);outline-offset:3px}@media(max-width:430px){body{padding:0;background:#171824}.annotate{right:16px;bottom:16px}}
</style></head><body><button class="annotate" id="annotate">批注模式</button><div class="phone"><main class="screen"><div class="status"><b>9:41</b><span>5G　82%</span></div><header class="top" data-note="页面标题与新增"><div><h1 id="title">空间</h1><span id="sub">按位置找到家里的东西</span></div><button class="add">＋</button></header><section class="content"><div class="switch" data-note="空间与分类切换"><button id="space" class="on">空间</button><button id="category">分类</button></div><div class="path" id="path" data-note="当前层级路径"></div><section class="intro" data-note="当前层级说明"><b id="intro"></b><span id="introSub"></span></section><section class="list" id="list" data-note="节点列表：拖动、左滑、下钻"></section><div class="note" id="hint" data-note="末层物品入口"></div></section><nav class="nav"><div class="navin" data-note="底部浮动胶囊导航"><button>⌂</button><button>□</button><button class="scan">⌗</button><button class="on">▥</button><button>♙</button></div></nav></main></div><script>
const tree={space:[['家','书房 A 柜|3 层 · 7 个收纳盒','工具柜|2 层 · 5 个收纳盒','储物间 B 柜|4 层 · 9 个收纳盒'],['书房 A 柜','1 层|2 个收纳盒','2 层|3 个收纳盒','3 层|2 个收纳盒'],['2 层','蓝色颜料盒|12 件物品','白色纸张盒|20 件物品','透明工具盒|8 件物品']],category:[['全部分类','画材|24 件物品','工具|31 件物品','纸张|18 件物品','日用品|55 件物品'],['画材','颜料|12 件物品','画笔|8 件物品','绘画工具|4 件物品'],['颜料','水彩颜料|7 件物品','丙烯颜料|5 件物品']]};let type='space',level=0,detail=null;const $=s=>document.querySelector(s);function render(){let rows=tree[type][level],space=type==='space';$('#title').textContent=detail?'详情':space?'空间':'分类';$('#sub').textContent=detail?'查看节点内物品':space?'按位置找到家里的东西':'按类别整理物品';$('#path').innerHTML=detail?`‹ 返回 ${rows[0]}`:`${rows[0]}${level?'　›　当前层级':''}`;$('#path').onclick=()=>{if(detail){detail=null;render()}else if(level){level--;render()}};$('#intro').textContent=detail?detail:(level?'当前：'+rows[0]:(space?'存储空间':'物品分类'));$('#introSub').textContent=detail?'该节点关联的物品列表。':'每次只显示当前层级，不展开整棵树。';if(detail){$('#list').innerHTML='<div class="detail"><b>温莎牛顿 24 色颜料</b><span>库存 3 盒 · 30 天后到期</span></div><div class="detail"><b>8K 水彩纸</b><span>库存 1 包 · 低库存提醒</span></div>';$('#hint').textContent='末层详情可继续打开物品页。';return}$('#list').innerHTML=rows.slice(1).map((r,i)=>{let[a,b]=r.split('|');return `<div class="swipe"><div class="actions"><button class="edit" onclick="event.stopPropagation();alert('修改：${a}')">修改</button><button class="delete" onclick="event.stopPropagation();confirm('确认删除「${a}」吗？')">删除</button></div><button class="node" onclick="openNode('${a}')"><span class="drag">⋮⋮</span><span class="ico ${i===1?'green':''}">${space?'▣':'◇'}</span><span class="main"><b>${a}</b><span>${b}</span></span><span class="arr">›</span></button></div>`}).join('');$('#hint').textContent=level===2?'点击节点进入详情；左滑可修改或删除。':'拖动左侧把手排序；左滑节点可修改或删除。';bindSwipe()}function openNode(name){if(level<2){level++;render()}else{detail=name;render()}}function bindSwipe(){document.querySelectorAll('.swipe').forEach(w=>{let x=0,d=0,row=w.querySelector('.node');w.onpointerdown=e=>{x=e.clientX;w.setPointerCapture(e.pointerId)};w.onpointermove=e=>{if(!x)return;d=Math.min(0,Math.max(-96,e.clientX-x));row.style.transform=`translateX(${d}px)`};w.onpointerup=()=>{row.style.transform=d<-38?'translateX(-96px)':'translateX(0)';x=0;d=0}})}function tab(t){type=t;level=0;detail=null;$('#space').classList.toggle('on',t==='space');$('#category').classList.toggle('on',t==='category');render()}$('#space').onclick=()=>tab('space');$('#category').onclick=()=>tab('category');$('#annotate').onclick=()=>{document.body.classList.toggle('annotating');$('#annotate').textContent=document.body.classList.contains('annotating')?'退出批注':'批注模式'};render()
</script></body></html>
