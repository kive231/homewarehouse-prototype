<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭仓库 · 空间与分类</title>
<style>
:root{--p:#6f7dcc;--ps:#f1f3ff;--bg:#f7f5f0;--card:#fffefb;--ink:#30313a;--muted:#85838a;--line:#ebe7df;--ok:#77a99c;--danger:#d87777;--shadow:0 5px 18px rgba(74,65,52,.055)}*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#e8e5e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.phone{width:320px;height:682px;border-radius:30px;padding:10px;background:#171824;box-shadow:0 28px 72px rgba(20,22,42,.28);position:relative}.phone:before{content:"";position:absolute;top:9px;left:50%;width:74px;height:5px;transform:translateX(-50%);border-radius:9px;background:#2a2d42;z-index:3}.screen{height:100%;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fcfbf8,var(--bg));display:flex;flex-direction:column;position:relative}.status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:#5f6472;font-size:10.5px}.top{padding:12px 18px 8px;display:flex;align-items:center}.top h1{font-size:21px;line-height:1.12;font-weight:680;letter-spacing:-.4px}.top span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.add{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--p);font-size:24px;line-height:1;cursor:pointer}.content{flex:1;overflow:auto;padding:4px 18px 82px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#eeeae3;border-radius:14px}.switch button{height:32px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 12px inherit;cursor:pointer}.switch button.on{background:var(--card);color:var(--p);box-shadow:var(--shadow)}.path{display:flex;align-items:center;gap:5px;overflow:hidden;padding:13px 0 9px;font-size:11px;color:var(--muted);white-space:nowrap}.path button{border:0;background:transparent;color:var(--p);font:650 11px inherit;cursor:pointer}.path i{font-style:normal;color:#b3ada5}.list{padding:2px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}.swipe:last-child{border:0}.actions{position:absolute;inset:0 0 0 auto;display:flex;align-items:stretch}.actions button{width:49px;border:0;color:#fff;font:600 10px inherit;cursor:pointer}.actions .edit{background:#8d98d9}.actions .delete{background:#d98787}.node{position:relative;width:100%;min-height:64px;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--card);border:0;color:var(--ink);text-align:left;touch-action:pan-y;transition:transform .18s ease;cursor:pointer}.grip{width:10px;flex:none;color:#c0bcb5;font-size:14px;letter-spacing:-2px;line-height:8px;cursor:grab;user-select:none}.node-icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:13px;background:var(--ps);color:var(--p)}.node-icon.green{background:#eff7f3;color:var(--ok)}svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.node-icon svg{width:20px;height:20px}.node-main{min-width:0;flex:1}.node-main b{display:block;font-size:12.5px;font-weight:650}.node-main span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.arrow{width:17px;height:17px;color:var(--muted)}.nav{height:70px;margin-top:-70px;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(247,245,240,.96) 32%);z-index:2}.navin{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 14px 30px rgba(35,40,80,.12)}.nav button{width:45px;height:38px;border:0;border-radius:999px;background:transparent;color:var(--muted);display:grid;place-items:center}.nav button.on{background:var(--ps);color:var(--p)}.nav .scan{width:49px;height:49px;margin:-7px 3px;border-radius:18px;background:var(--p);color:#fff}.nav svg{width:19px;height:19px}.editor-page{position:absolute;inset:0;z-index:10;display:none;background:linear-gradient(180deg,#fcfbf8,var(--bg));overflow:auto}.editor-page.show{display:block}.editor-top{height:69px;display:flex;align-items:center;padding:20px 18px 8px;border-bottom:1px solid rgba(235,231,223,.7)}.editor-back{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--p);cursor:pointer}.editor-back svg{width:18px;height:18px}.editor-top h2{margin-left:11px;font-size:16px;letter-spacing:-.2px}.editor-body{padding:22px 18px}.editor-context{padding:13px 14px;border:1px solid #e2e5fa;border-radius:16px;background:var(--ps);color:var(--p);font-size:11px}.editor-context b{display:block;margin-top:4px;color:var(--ink);font-size:13px}.editor-label{display:block;margin:22px 0 8px;font-size:12px;font-weight:650}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fcfaf6;font:13px inherit;outline:0}.field:focus{border-color:var(--p)}.editor-save{width:100%;margin-top:20px;border:0;border-radius:13px;padding:13px;background:var(--p);color:#fff;font:650 13px inherit;cursor:pointer}.annotate-toggle{position:fixed;right:22px;bottom:22px;z-index:40;border:0;border-radius:999px;background:var(--p);color:#fff;padding:12px 16px;font-size:13px;font-weight:680;box-shadow:0 10px 24px rgba(111,125,204,.2);cursor:pointer}.annotating .annotatable{outline:2px dashed rgba(111,125,204,.38);outline-offset:3px}.annotation-panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:min(360px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 46px rgba(30,25,18,.18);padding:14px;display:none}.annotation-panel.show{display:block}.annotation-panel b{display:block;font-size:13px;margin-bottom:8px}.annotation-panel textarea{width:100%;height:84px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px inherit;background:#f8f9fc}.annotation-actions{display:flex;gap:8px;margin-top:10px}.annotation-actions button{flex:1;border:0;border-radius:11px;padding:10px;font-size:12px;font-weight:680}.annotation-save{background:var(--p);color:#fff}.annotation-cancel{background:var(--ps);color:var(--p)}.annotation-output{position:fixed;right:22px;top:22px;z-index:45;width:286px;max-height:285px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 36px rgba(30,25,18,.14);padding:12px;display:none}.annotation-output.show{display:block}.annotation-output h4{font-size:13px;margin-bottom:8px}.annotation-output pre{white-space:pre-wrap;font-size:11px;line-height:1.45;color:var(--muted)}.annotation-output button{margin-top:8px;width:100%;border:0;border-radius:10px;background:var(--p);color:#fff;padding:9px;font-size:12px;font-weight:680}@media(max-width:430px){body{padding:0;background:#171824}.annotate-toggle{right:16px;bottom:16px}.annotation-output{display:none!important}}
</style></head>
<body>
<svg style="display:none"><defs><g id="cab"><path d="M4 3h16v18H4zM4 11h16M9 7h.01M9 15h.01"/></g><g id="box"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></g><g id="tag"><path d="M20 13 13 20 3 10V3h7l10 10Z"/><path d="M7 7h.01"/></g><g id="home"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></g><g id="scan"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 12h10"/></g><g id="user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></g><g id="arr"><path d="m9 18 6-6-6-6"/></g><g id="back"><path d="m15 18-6-6 6-6"/></g></defs></svg>
<button class="annotate-toggle" id="annotateToggle">批注模式</button><div class="annotation-panel" id="annotationPanel"><b id="annotationTarget">批注</b><textarea id="annotationText" placeholder="写下这里要怎么改"></textarea><div class="annotation-actions"><button class="annotation-cancel" id="annotationCancel">取消</button><button class="annotation-save" id="annotationSave">保存批注</button></div></div><div class="annotation-output" id="annotationOutput"><h4>批注已记录</h4><pre id="annotationList"></pre><button id="copyAnnotations">复制给小洛</button></div>
<div class="phone"><main class="screen"><div class="status"><b>9:41</b><span>5G　82%</span></div><header class="top annotatable" data-annotation="空间与分类页标题"><div><h1 id="title">空间</h1><span id="subtitle">按位置找到家里的东西</span></div><button class="add" id="add">＋</button></header><section class="content"><div class="switch annotatable" data-annotation="空间与分类切换"><button class="on" id="spaceTab">空间</button><button id="categoryTab">分类</button></div><div class="path annotatable" data-annotation="当前层级路径" id="path"></div><section class="list annotatable" data-annotation="当前层级节点列表" id="list"></section></section><nav class="nav"><div class="navin annotatable" data-annotation="底部浮动胶囊导航"><button><svg><use href="#home"/></svg></button><button><svg><use href="#box"/></svg></button><button class="scan"><svg><use href="#scan"/></svg></button><button class="on"><svg><use href="#cab"/></svg></button><button><svg><use href="#user"/></svg></button></div></nav><section class="editor-page annotatable" data-annotation="空间与分类新增编辑页" id="editorPage"><header class="editor-top"><button class="editor-back" id="editorBack" aria-label="返回"><svg><use href="#back"/></svg></button><h2 id="editorTitle">新增空间</h2></header><div class="editor-body"><div class="editor-context">归属位置<b id="editorParent"></b></div><label class="editor-label" for="nodeName">名称</label><input class="field" id="nodeName" maxlength="18" placeholder="请输入名称"><button class="editor-save" id="editorSave">保存</button></div></section></main></div>
<script>
const $=s=>document.querySelector(s);const trees={space:[{name:'家',rows:[['书房 A 柜','3 层 · 7 个收纳盒'],['工具柜','2 层 · 5 个收纳盒'],['储物间 B 柜','4 层 · 9 个收纳盒']]},{name:'书房 A 柜',rows:[['1 层','2 个收纳盒'],['2 层','3 个收纳盒'],['3 层','2 个收纳盒']]},{name:'2 层',rows:[['蓝色颜料盒','12 件物品'],['白色纸张盒','20 件物品'],['透明工具盒','8 件物品']]},{name:'蓝色颜料盒',rows:[['温莎牛顿 24 色颜料','临期 30 天'],['调色盘','正常'],['水彩笔','正常']]}],category:[{name:'全部分类',rows:[['画材','24 件物品'],['工具','31 件物品'],['纸张','18 件物品'],['日用品','55 件物品']]},{name:'画材',rows:[['颜料','12 件物品'],['画笔','8 件物品'],['绘画工具','4 件物品']]},{name:'颜料',rows:[['水彩颜料','7 件物品'],['丙烯颜料','5 件物品']]},{name:'水彩颜料',rows:[['温莎牛顿 24 色颜料','临期 30 天'],['固体水彩','正常']]}]};let type='space',level=0,editing=null;function kind(){return type==='space'?(level>1?'box':'cab'):'tag'}function render(){let node=trees[type][level];$('#title').textContent=type==='space'?'空间':'分类';$('#subtitle').textContent=type==='space'?'按位置找到家里的东西':'按类别整理物品';$('#spaceTab').classList.toggle('on',type==='space');$('#categoryTab').classList.toggle('on',type==='category');$('#path').innerHTML=trees[type].slice(0,level+1).map((n,i)=>`${i?'<i>›</i>':''}<button data-back="${i}">${n.name}</button>`).join('');$('#list').innerHTML=node.rows.map((r,i)=>`<div class="swipe"><div class="actions"><button class="edit" data-edit="${i}">修改</button><button class="delete" data-delete="${i}">删除</button></div><button class="node" data-go="${i}"><span class="grip">⋮⋮</span><span class="node-icon ${i===1?'green':''}"><svg><use href="#${kind()}"/></svg></span><span class="node-main"><b>${r[0]}</b><span>${r[1]}</span></span><svg class="arrow"><use href="#arr"/></svg></button></div>`).join('');bindRows()}function bindRows(){document.querySelectorAll('.node').forEach(node=>{let x=0,open=false;node.onpointerdown=e=>{x=e.clientX;open=false};node.onpointermove=e=>{if(x-e.clientX>28){node.style.transform='translateX(-98px)';open=true}if(e.clientX-x>12){node.style.transform='';open=false}};node.onpointerup=()=>{if(!open)go(+node.dataset.go)}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEditor(+b.dataset.edit)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();let i=+b.dataset.delete;if(confirm('删除“'+trees[type][level].rows[i][0]+'”？')){trees[type][level].rows.splice(i,1);render()}})}function go(i){if(level<3){level++;render()}else alert('物品详情：'+trees[type][level].rows[i][0])}function switchType(t){type=t;level=0;render()}function openEditor(i){editing=i;$('#editorTitle').textContent=(i===null?'新增':'修改')+(type==='space'?'空间':'分类');$('#editorParent').textContent=trees[type][level].name;$('#nodeName').value=i===null?'':trees[type][level].rows[i][0];$('#editorPage').classList.add('show');setTimeout(()=>$('#nodeName').focus(),80)}function closeEditor(){$('#editorPage').classList.remove('show')}$('#spaceTab').onclick=()=>switchType('space');$('#categoryTab').onclick=()=>switchType('category');$('#add').onclick=()=>openEditor(null);$('#path').onclick=e=>{let i=e.target.dataset.back;if(i!==undefined){level=+i;render()}};$('#editorBack').onclick=closeEditor;$('#editorSave').onclick=()=>{let value=$('#nodeName').value.trim();if(!value)return;let rows=trees[type][level].rows;if(editing===null)rows.push([value,level===3?'正常':'0 个子项']);else rows[editing][0]=value;closeEditor();render()};let active=false,current=null,notes=[];function refresh(){if(!notes.length)return;$('#annotationList').textContent='页面批注：\n'+notes.map((n,i)=>`${i+1}. [${n.area}] ${n.note}`).join('\n');$('#annotationOutput').classList.add('show')}$('#annotateToggle').onclick=()=>{active=!active;document.body.classList.toggle('annotating',active);$('#annotateToggle').textContent=active?'退出批注':'批注模式'};document.addEventListener('click',e=>{let el=e.target.closest('.annotatable');if(!active||!el)return;e.preventDefault();e.stopPropagation();current=el;$('#annotationTarget').textContent='批注：'+el.dataset.annotation;$('#annotationText').value='';$('#annotationPanel').classList.add('show')},true);$('#annotationCancel').onclick=()=>$('#annotationPanel').classList.remove('show');$('#annotationSave').onclick=()=>{let note=$('#annotationText').value.trim();if(!current||!note)return;notes.push({area:current.dataset.annotation,note});$('#annotationPanel').classList.remove('show');refresh()};$('#copyAnnotations').onclick=async function(){let v=$('#annotationList').textContent;try{await navigator.clipboard.writeText(v);this.textContent='已复制，发给小洛'}catch(e){this.textContent='请手动复制上方文本'}};render();
</script></body></html>
