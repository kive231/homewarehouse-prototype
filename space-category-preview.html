<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭仓库 · 空间与分类</title><style>
:root{--p:#6f7dcc;--ps:#f1f3ff;--bg:#f7f5f0;--card:#fffefb;--ink:#30313a;--muted:#85838a;--line:#ebe7df;--ok:#77a99c;--shadow:0 5px 18px rgba(74,65,52,.055)}*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#e8e5e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.phone{width:320px;height:682px;border-radius:30px;padding:10px;background:#171824;box-shadow:0 28px 72px rgba(20,22,42,.28);position:relative}.phone:before{content:"";position:absolute;top:9px;left:50%;width:74px;height:5px;transform:translateX(-50%);border-radius:9px;background:#2a2d42;z-index:3}.screen{height:100%;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fcfbf8,var(--bg));display:flex;flex-direction:column}.status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:#5f6472;font-size:10.5px}.top{padding:12px 18px 8px;display:flex;align-items:center}.top h1{font-size:21px;line-height:1.12;font-weight:680;letter-spacing:-.4px}.top span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.add{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--p);font-size:24px;line-height:1}.content{flex:1;overflow:auto;padding:4px 18px 82px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#eeeae3;border-radius:14px}.switch button{height:32px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 12px inherit}.switch button.on{background:var(--card);color:var(--p);box-shadow:var(--shadow)}.path{display:flex;align-items:center;gap:5px;overflow:hidden;padding:13px 0 9px;font-size:11px;color:var(--muted);white-space:nowrap}.path b{color:var(--p);font-weight:650}.path i{font-style:normal;color:#b3ada5}.intro{padding:13px 14px;border:1px solid #e2e5fa;border-radius:18px;background:var(--ps)}.intro b{font-size:14px}.intro span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.list{margin-top:12px;padding:2px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.node{width:100%;min-height:64px;display:flex;align-items:center;gap:10px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left}.node:last-child{border:0}.node-icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:13px;background:var(--ps);color:var(--p)}.node-icon.green{background:#eff7f3;color:var(--ok)}.node svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.node-main{min-width:0;flex:1}.node-main b{display:block;font-size:12.5px;font-weight:650}.node-main span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.arrow{color:var(--muted)}.empty-note{margin-top:12px;padding:10px 12px;border-radius:14px;background:#fbf2e8;color:#9b7b58;font-size:10px}.nav{height:70px;margin-top:-70px;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(247,245,240,.96) 32%);z-index:2}.navin{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 14px 30px rgba(35,40,80,.12)}.nav button{width:45px;height:38px;border:0;border-radius:999px;background:transparent;color:var(--muted);display:grid;place-items:center}.nav button.on{background:var(--ps);color:var(--p)}.nav .scan{width:49px;height:49px;margin:-7px 3px;border-radius:18px;background:var(--p);color:#fff}.annotate{position:fixed;right:22px;bottom:22px;z-index:9;border:0;border-radius:999px;padding:12px 16px;background:var(--p);color:#fff;font:600 13px inherit;box-shadow:0 10px 24px rgba(111,125,204,.2)}.annotating .note{outline:2px dashed rgba(111,125,204,.42);outline-offset:3px}.panel{display:none;position:fixed;z-index:10;left:50%;bottom:20px;width:min(360px,calc(100vw - 28px));transform:translateX(-50%);padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 46px rgba(30,25,18,.18)}.panel.show{display:block}.panel b{display:block;font-size:13px;margin-bottom:8px}.panel textarea{width:100%;height:76px;resize:none;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fcfaf6;font:13px inherit}.panel div{display:flex;gap:8px;margin-top:8px}.panel button{flex:1;border:0;border-radius:10px;padding:9px;font:600 12px inherit}.save{background:var(--p);color:#fff}.cancel{background:var(--ps);color:var(--p)}@media(max-width:430px){body{padding:0;background:#171824}.annotate{right:16px;bottom:16px}}
</style></head><body><svg style="display:none"><defs><g id="cab"><path d="M4 3h16v18H4zM4 11h16M9 7h.01M9 15h.01"/></g><g id="box"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></g><g id="tag"><path d="M20 13 13 20 3 10V3h7l10 10Z"/><path d="M7 7h.01"/></g><g id="home"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></g><g id="scan"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 12h10"/></g><g id="user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></g><g id="arr"><path d="m9 18 6-6-6-6"/></g></defs></svg><button class="annotate" id="toggle">批注模式</button><div class="panel" id="panel"><b id="target">批注</b><textarea id="text" placeholder="写下这里要怎么改"></textarea><div><button class="cancel" id="cancel">取消</button><button class="save" id="save">保存批注</button></div></div><div class="phone"><main class="screen"><div class="status"><b>9:41</b><span>5G　82%</span></div><header class="top note" data-note="空间与分类页标题"><div><h1 id="title">空间</h1><span id="subtitle">按位置找到家里的东西</span></div><button class="add">＋</button></header><section class="content"><div class="switch note" data-note="空间与分类切换"><button class="on" id="spaceTab">空间</button><button id="categoryTab">分类</button></div><div class="path note" data-note="当前层级路径" id="path"></div><section class="intro note" data-note="当前层级说明"><b id="introTitle"></b><span id="introSub"></span></section><section class="list note" data-note="当前层级节点列表" id="list"></section><div class="empty-note note" data-note="到达最末层后的物品入口" id="foot">点进收纳盒后，可继续查看盒内物品</div></section><nav class="nav"><div class="navin note" data-note="底部浮动胶囊导航"><button><svg><use href="#home"/></svg></button><button><svg><use href="#box"/></svg></button><button class="scan"><svg><use href="#scan"/></svg></button><button class="on"><svg><use href="#cab"/></svg></button><button><svg><use href="#user"/></svg></button></div></nav></main></div><script>const data={space:[['家','书房 A 柜|3 层 · 7 个收纳盒','工具柜|2 层 · 5 个收纳盒','储物间 B 柜|4 层 · 9 个收纳盒'],['书房 A 柜','1 层|2 个收纳盒','2 层|3 个收纳盒','3 层|2 个收纳盒'],['2 层','蓝色颜料盒|12 件物品','白色纸张盒|20 件物品','透明工具盒|8 件物品']],category:[['全部分类','画材|24 件物品','工具|31 件物品','纸张|18 件物品','日用品|55 件物品'],['画材','颜料|12 件物品','画笔|8 件物品','绘画工具|4 件物品'],['颜料','水彩颜料|7 件物品','丙烯颜料|5 件物品']]};let type='space',level=0,active=false,current;const $=s=>document.querySelector(s);function icon(){return type==='space'?(level===2?'box':'cab'):'tag'}function render(){const rows=data[type][level],isSpace=type==='space';$('#title').textContent=isSpace?'空间':'分类';$('#subtitle').textContent=isSpace?'按位置找到家里的东西':'按类别整理物品';$('#path').innerHTML=rows[0].split(' ').map((x,i)=>i?`<i>›</i><b>${x}</b>`:`<b>${x}</b>`).join('');$('#introTitle').textContent=level===0?(isSpace?'存储空间':'物品分类'):`${rows[0]} · 第 ${level+1} 层`;$('#introSub').textContent=level===0?'从当前层级逐步进入，不展开复杂树。':'点选一个节点继续进入下一层。';$('#list').innerHTML=rows.slice(1).map((r,i)=>{let [a,b]=r.split('|');return `<button class="node" onclick="go(${i})"><span class="node-icon ${i===1?'green':''}"><svg><use href="#${icon()}"/></svg></span><span class="node-main"><b>${a}</b><span>${b}</span></span><svg class="arrow"><use href="#arr"/></svg></button>`}).join('');$('#foot').textContent=level===2?(isSpace?'此收纳盒下展示物品列表。':'此细类下展示物品列表。'):'不用展开整棵树，只查看当前层级。'}function go(i){if(level<2){level++;render()}}function tab(t){type=t;level=0;$('#spaceTab').classList.toggle('on',t==='space');$('#categoryTab').classList.toggle('on',t==='category');render()}$('#spaceTab').onclick=()=>tab('space');$('#categoryTab').onclick=()=>tab('category');$('#toggle').onclick=()=>{active=!active;document.body.classList.toggle('annotating',active);$('#toggle').textContent=active?'退出批注':'批注模式'};document.querySelectorAll('.note').forEach(e=>e.onclick=ev=>{if(!active)return;ev.preventDefault();ev.stopPropagation();current=e;$('#target').textContent='批注：'+e.dataset.note;$('#panel').classList.add('show');$('#text').focus()});$('#cancel').onclick=()=>$('#panel').classList.remove('show');$('#save').onclick=()=>{$('#panel').classList.remove('show');$('#text').value=''};render()</script></body></html>
