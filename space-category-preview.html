<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭仓库 · 空间与分类</title><style>
:root{--primary:#6f7dcc;--primary-soft:#f1f3ff;--ok:#77a99c;--warn:#d9a16f;--bad:#d77778;--bg:#f7f5f0;--card:#fffefb;--ink:#30313a;--muted:#85838a;--line:#ebe7df;--shadow:0 5px 18px rgba(74,65,52,.055);--float:0 10px 26px rgba(74,65,52,.09)}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8e5e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px}button,input{font-family:inherit}.phone{width:320px;height:682px;border-radius:30px;padding:10px;background:#171824;box-shadow:0 28px 72px rgba(20,22,42,.28),inset 0 0 0 1px rgba(255,255,255,.05);position:relative}.phone:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:74px;height:5px;border-radius:99px;background:#2a2d42;z-index:5}.screen{width:100%;height:100%;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fcfbf8 0%,var(--bg) 46%,#f3f0eb 100%);display:flex;flex-direction:column}.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10.5px;color:#5f6472;flex:0 0 auto}.top{padding:12px 18px 8px;display:flex;align-items:center;gap:12px}.top h1{font-size:21px;line-height:1.12;font-weight:680;letter-spacing:-.4px}.top span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.add{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--primary);font-size:23px}.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{display:none}.content{padding:4px 18px 82px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#eeeae3;border-radius:14px}.switch button{height:32px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:600}.switch button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}.path{display:flex;align-items:center;gap:5px;min-height:36px;overflow:hidden;font-size:10px;white-space:nowrap;color:var(--muted)}.path button{border:0;background:transparent;color:var(--primary);font:650 10px inherit}.path i{font-style:normal;color:#aaa59f}.summary{padding:14px;border-radius:18px;border:1px solid #e2e5fa;background:var(--primary-soft)}.summary b{font-size:14px;font-weight:680}.summary span{display:block;margin-top:4px;font-size:10px;color:var(--muted)}.list{margin-top:12px;padding:2px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}.swipe:last-child{border-bottom:0}.node{position:relative;z-index:1;width:100%;min-height:64px;display:flex;align-items:center;gap:9px;padding:10px 0;border:0;background:var(--card);color:var(--ink);text-align:left;transition:transform .2s ease}.handle{width:12px;flex:0 0 12px;color:#b6b1ac;font-size:15px;letter-spacing:-3px;line-height:1;cursor:grab}.node-icon{width:38px;height:38px;flex:0 0 38px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}.node-icon.green{background:#eff7f3;color:var(--ok)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.node-main{flex:1;min-width:0}.node-main b{display:block;font-size:12.5px;font-weight:650}.node-main span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}.arrow{color:var(--muted)}.row-actions{position:absolute;right:0;top:0;height:100%;display:flex}.row-actions button{width:48px;border:0;color:#fff;font-size:10px;font-weight:650}.edit{background:var(--primary)}.delete{background:var(--bad)}.tip{margin-top:12px;padding:10px 12px;border-radius:14px;background:#fbf2e8;color:#9b7b58;font-size:10px}.bottom-nav{height:70px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:linear-gradient(180deg,rgba(247,245,240,0),rgba(247,245,240,.96) 32%);margin-top:-70px;z-index:2}.nav-capsule{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 14px 30px rgba(35,40,80,.12)}.nav-item,.nav-scan{border:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}.nav-item{width:45px;height:38px;border-radius:999px;background:transparent}.nav-item.on{background:var(--primary-soft);color:var(--primary)}.nav-scan{width:49px;height:49px;border-radius:18px;margin:-7px 3px;background:var(--primary);color:#fff;box-shadow:0 9px 18px rgba(111,125,204,.24)}.nav-scan svg{width:22px;height:22px}.sheet-mask{display:none;position:absolute;inset:0;z-index:10;background:rgba(35,31,38,.25);align-items:flex-end}.sheet-mask.show{display:flex}.sheet{width:100%;padding:16px 18px 22px;border-radius:22px 22px 0 0;background:var(--card);box-shadow:0 -12px 36px rgba(35,31,38,.12)}.sheet h2{font-size:16px;font-weight:680}.sheet p{margin-top:5px;font-size:10px;color:var(--muted)}.field{display:block;margin-top:16px;font-size:11px;color:var(--muted)}.field input{display:block;width:100%;height:42px;margin-top:7px;padding:0 12px;border:1px solid var(--line);border-radius:13px;background:#fcfaf6;color:var(--ink);outline:none}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions button{flex:1;height:42px;border:0;border-radius:13px;font-size:12px;font-weight:650}.cancel{background:var(--primary-soft);color:var(--primary)}.save{background:var(--primary);color:#fff}.annotate{position:fixed;right:22px;bottom:22px;z-index:20;border:0;border-radius:999px;background:var(--primary);color:#fff;padding:12px 16px;font-size:13px;font-weight:680;box-shadow:0 10px 24px rgba(111,125,204,.2)}.annotating [data-note]{outline:2px dashed rgba(111,125,204,.4);outline-offset:3px}@media(max-width:430px){body{padding:0;background:#171824}.annotate{right:16px;bottom:16px}}
</style></head><body><svg style="display:none"><defs><g id="cab"><path d="M4 3h16v18H4zM4 11h16M9 7h.01M9 15h.01"/></g><g id="box"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></g><g id="tag"><path d="M20 13 13 20 3 10V3h7l10 10Z"/><path d="M7 7h.01"/></g><g id="home"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></g><g id="list"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></g><g id="scan"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 12h10"/></g><g id="user"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></g><g id="arr"><path d="m9 18 6-6-6-6"/></g></defs></svg><button class="annotate" id="annotate">批注模式</button><div class="phone"><main class="screen"><div class="status"><b>9:41</b><span>5G　82%</span></div><header class="top" data-note="空间与分类标题、新增"><div><h1 id="title">空间</h1><span id="subtitle">按位置找到家里的东西</span></div><button class="add" id="add">＋</button></header><div class="scroll"><main class="content"><section class="switch" data-note="空间与分类切换"><button class="on" id="spaceTab">空间</button><button id="categoryTab">分类</button></section><section class="path" data-note="逐级进入与返回路径" id="path"></section><section class="summary" data-note="当前层级摘要"><b id="summaryTitle"></b><span id="summaryText"></span></section><section class="list" data-note="节点列表：拖动、左滑、点击下钻" id="list"></section><div class="tip" data-note="当前操作提示" id="tip"></div></main></div><nav class="bottom-nav"><div class="nav-capsule" data-note="底部浮动胶囊导航"><button class="nav-item"><svg><use href="#home"/></svg></button><button class="nav-item"><svg><use href="#box"/></svg></button><button class="nav-scan"><svg><use href="#scan"/></svg></button><button class="nav-item on"><svg><use href="#cab"/></svg></button><button class="nav-item"><svg><use href="#user"/></svg></button></div></nav><div class="sheet-mask" id="mask"><section class="sheet"><h2 id="sheetTitle">新增</h2><p id="sheetHint"></p><label class="field">名称<input id="nameInput" placeholder="例如：书房 A 柜"></label><div class="sheet-actions"><button class="cancel" id="cancel">取消</button><button class="save" id="save">保存</button></div></section></div></main></div><script>
const tree={space:[['家','书房 A 柜|3 层 · 7 个收纳盒','工具柜|2 层 · 5 个收纳盒','储物间 B 柜|4 层 · 9 个收纳盒'],['书房 A 柜','1 层|2 个收纳盒','2 层|3 个收纳盒','3 层|2 个收纳盒'],['2 层','蓝色颜料盒|12 件物品','白色纸张盒|20 件物品','透明工具盒|8 件物品']],category:[['全部分类','画材|24 件物品','工具|31 件物品','纸张|18 件物品','日用品|55 件物品'],['画材','颜料|12 件物品','画笔|8 件物品','绘画工具|4 件物品'],['颜料','水彩颜料|7 件物品','丙烯颜料|5 件物品']]};let type='space',level=0,crumbs=['家'],editing=null;const $=s=>document.querySelector(s);function nodeKind(){return type==='space'?['柜子','层','收纳盒'][level]:['大类','子类','细类'][level]}function render(){let rows=tree[type][level],space=type==='space';$('#title').textContent=space?'空间':'分类';$('#subtitle').textContent=space?'按位置找到家里的东西':'按类别整理物品';$('#path').innerHTML=crumbs.map((c,i)=>`<button onclick="backTo(${i})">${c}</button>${i<crumbs.length-1?'<i>›</i>':''}`).join('');$('#summaryTitle').textContent=level?`当前：${rows[0]}`:space?'存储空间':'物品分类';$('#summaryText').textContent=level?'点击节点继续进入下一层；路径可返回。':'每次只显示当前层级，不展开复杂树。';$('#list').innerHTML=rows.slice(1).map((r,i)=>{let[a,b]=r.split('|');return `<div class="swipe"><div class="row-actions"><button class="edit" onclick="event.stopPropagation();openSheet('edit','${a}')">修改</button><button class="delete" onclick="event.stopPropagation();removeNode('${a}')">删除</button></div><button class="node" onclick="enter('${a}')"><span class="handle">⋮⋮</span><span class="node-icon ${i===1?'green':''}"><svg><use href="#${space?'cab':'tag'}"/></svg></span><span class="node-main"><b>${a}</b><span>${b}</span></span><svg class="arrow"><use href="#arr"/></svg></button></div>`}).join('');$('#tip').textContent='左侧把手拖动排序；左滑露出修改和删除。';bindSwipe()}function enter(name){if(level<2){level++;crumbs.push(name);render()}else{alert('进入「'+name+'」详情：这里展示关联物品列表。')}}function backTo(i){level=i;crumbs=crumbs.slice(0,i+1);render()}function tab(t){type=t;level=0;crumbs=[t==='space'?'家':'全部分类'];$('#spaceTab').classList.toggle('on',t==='space');$('#categoryTab').classList.toggle('on',t==='category');render()}function openSheet(mode,name=''){editing={mode,name};$('#sheetTitle').textContent=mode==='edit'?'修改'+nodeKind():'新增'+nodeKind();$('#sheetHint').textContent=mode==='edit'?'修改后保持在当前层级。':'将自动添加到「'+crumbs.at(-1)+'」下。';$('#nameInput').value=name;$('#mask').classList.add('show');$('#nameInput').focus()}function removeNode(name){if(confirm('确认删除「'+name+'」吗？'))alert('已删除（预览效果）')}function bindSwipe(){document.querySelectorAll('.swipe').forEach(w=>{let x=0,d=0,row=w.querySelector('.node');w.onpointerdown=e=>{x=e.clientX;w.setPointerCapture(e.pointerId)};w.onpointermove=e=>{if(!x)return;d=Math.min(0,Math.max(-96,e.clientX-x));row.style.transform=`translateX(${d}px)`};w.onpointerup=()=>{row.style.transform=d<-38?'translateX(-96px)':'translateX(0)';x=0;d=0}})}$('#spaceTab').onclick=()=>tab('space');$('#categoryTab').onclick=()=>tab('category');$('#add').onclick=()=>openSheet('add');$('#cancel').onclick=()=>$('#mask').classList.remove('show');$('#save').onclick=()=>{$('#mask').classList.remove('show');alert((editing.mode==='edit'?'已修改：':'已新增：')+$('#nameInput').value+'（预览效果）')};$('#annotate').onclick=()=>{document.body.classList.toggle('annotating');$('#annotate').textContent=document.body.classList.contains('annotating')?'退出批注':'批注模式'};render()
</script></body></html>
