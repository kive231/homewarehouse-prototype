<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家庭仓库 — huashu Purple</title>
<style>
:root{
  --bg:#f8f9fa; --screen-bg:#fafbfc; --card:#fff; --ink:#2d2d3a;
  --muted:#b0b0b8; --line:#eeeef0; --brand:#5b6abf; --brand-light:#eef0fb;
  --green:#5baa9e; --orange:#e8a87c; --red:#d9626e;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.02); --shadow-md:0 2px 8px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#f5f6fa 0%,#fafbfc 40%,#f8f9fa 100%);
  color:var(--ink);min-height:100vh;padding:32px 20px;
}
.page-header{text-align:center;margin-bottom:32px}
.page-header h1{font-size:20px;font-weight:600;color:var(--brand);letter-spacing:-.3px}
.page-header p{font-size:12px;color:var(--muted);margin-top:4px}

.tile-grid{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:1440px;margin:0 auto}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile-label{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px}

/* Phone frame */
.phone{
  width:280px;height:600px;
  background:#1a1c2b;border-radius:24px;padding:8px;
  box-shadow:0 16px 48px rgba(30,35,70,.14),inset 0 0 0 1px rgba(255,255,255,.04);
}
.phone::before{
  content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:64px;height:4px;background:#2d314a;border-radius:99px;z-index:5;
}
.screen{
  width:100%;height:100%;background:var(--screen-bg);border-radius:18px;
  overflow:hidden;display:flex;flex-direction:column;
}
.phone{position:relative}

/* Status */
.status{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:10px;color:var(--ink);flex-shrink:0;background:rgba(255,255,255,.8)}

/* Nav */
.nav{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .back{width:28px;height:28px;border-radius:14px;background:var(--brand-light);display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--brand);border:none;flex-shrink:0}
.nav .back.show{display:flex}
.nav .title{font-size:15px;font-weight:600;flex:1}
.nav .action{font-size:12px;color:var(--brand);cursor:pointer;border:none;background:none;font-weight:500}

/* Scroll */
.scroll{flex:1;overflow-y:auto}
.scroll::-webkit-scrollbar{display:none}
.page{padding:12px 14px 76px;display:flex;flex-direction:column;gap:10px}
.page{display:none}
.page.active{display:flex}

/* Tab bar */
.tabs{height:52px;display:flex;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);flex-shrink:0;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--muted);font-weight:500;cursor:pointer;border:none;background:none;padding:5px 0}
.tab.on{color:var(--brand)}
.tab svg{width:18px;height:18px}
.scan-slot{flex:0 0 52px;display:flex;justify-content:center;position:relative}
.scan-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#6b7bd4,#5b6abf);
  box-shadow:0 4px 16px rgba(91,106,191,.3);
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;border:none;position:absolute;bottom:-2px;
}

/* Cards */
.card{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.hero{
  background:linear-gradient(135deg,#5b6abf 0%,#7b8ad6 60%,#9ba8e8 100%);
  color:#fff;border-radius:14px;padding:18px 16px;
  box-shadow:0 4px 16px rgba(91,106,191,.18);
}
.hero h2{font-size:22px;font-weight:600;letter-spacing:-.4px}
.hero p{font-size:11px;opacity:.82;margin-top:3px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.stat-item{padding:10px 4px;cursor:pointer}
.stat-item b{display:block;font-size:18px;font-weight:600}
.stat-item span{font-size:10px;color:var(--muted)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0}
.section-head b{font-size:13px;font-weight:600}
.section-head a{font-size:11px;color:var(--brand);cursor:pointer;font-weight:500}

.list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-icon{
  width:34px;height:34px;border-radius:8px;background:var(--brand-light);
  display:flex;align-items:center;justify-content:center;color:var(--brand);flex-shrink:0;
}
.list-info{flex:1;min-width:0}
.list-info b{display:block;font-size:13px;font-weight:600}
.list-info small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.list-right{text-align:right;flex-shrink:0}

.tag{padding:2px 7px;border-radius:8px;font-size:9px;font-weight:600}
.tag.warn{background:#fff5ee;color:var(--orange)}
.tag.bad{background:#fff0f2;color:var(--red)}
.tag.ok{background:#eef8f5;color:var(--green)}

.act-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act-tile{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px;display:flex;flex-direction:column;gap:4px;cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.act-tile svg{color:var(--brand)}
.act-tile b{font-size:13px;font-weight:600}
.act-tile small{font-size:10px;color:var(--muted)}

.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick-btn{
  aspect-ratio:1;background:var(--brand-light);border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:12px;font-weight:500;border:none;color:var(--brand);
}

.search-bar{
  display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;
  padding:10px 12px;font-size:12px;color:var(--muted);
}

.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  padding:6px 11px;border-radius:99px;font-size:10px;font-weight:500;cursor:pointer;
  background:var(--brand-light);color:var(--brand);border:none;
}
.chip.on{background:var(--brand);color:#fff}

.tree-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  cursor:pointer;box-shadow:var(--shadow-sm);
}
.tree-body{flex:1}
.tree-body b{font-size:13px;font-weight:600}
.tree-body small{font-size:10px;color:var(--muted)}
.progress{height:3px;background:#eeeef0;border-radius:2px;margin-top:6px;width:70%}
.progress .bar{height:100%;border-radius:2px;background:var(--green)}

.info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--muted)}
.info-row .v{font-weight:600}

.detail-hero{
  background:linear-gradient(135deg,#f8f9ff,#eef0fb);border:1px solid var(--line);
  border-radius:12px;padding:16px;text-align:center;
}
.detail-hero h2{font-size:17px;font-weight:600}
.detail-hero .count{font-size:28px;font-weight:600;color:var(--brand);margin:3px 0}

.btn{
  border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(91,106,191,.2);width:100%}
.btn-o{background:#fff;color:var(--brand);border:1px solid var(--brand);width:100%}
.btn-d{background:#fff0f2;color:var(--red);border:1px solid #fdd;width:100%;margin-top:6px}

.set-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set-row:last-child{border-bottom:none}
.set-icon{width:32px;height:32px;border-radius:8px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.set-text{flex:1}
.set-text b{display:block;font-size:13px;font-weight:600}
.set-text small{display:block;font-size:9px;color:var(--muted);margin-top:2px}

.form-field{display:flex;flex-direction:column;gap:3px}
.form-field label{font-size:11px;font-weight:600}
.input{
  width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:13px;background:var(--bg);outline:none;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light)}

.bread{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--muted);padding-bottom:2px}
.bread span{cursor:pointer;color:var(--brand)}

.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qr-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.qr-block{width:48px;height:48px;margin:0 auto 6px;border-radius:8px;background:repeating-linear-gradient(45deg,#5b6abf 0 3px,#fff 3px 6px)}
</style>

<body>
<div class="page-header"><h1>家庭仓库</h1><p>紫调 · 简微风 · 4 Tab 原型</p></div>
<div class="tile-grid">

<script>
function svg(id){return'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#'+id+'"/></svg>'}
function E(t,c,h){return'<'+t+' class="'+c+'">'+h+'</'+t+'>'} // element
function tag(st,exp){
  if(st==='expiring') return '<span class="tag warn">'+exp+'天</span>';
  if(st==='low') return '<span class="tag bad">低库存</span>';
  return '';
}

// ===== PAGES =====
var P={};

P.home=
  E('div','hero','<div style="font-size:10px;opacity:.75">家庭仓库</div><h2>128 件物品</h2><p>3 件临期 · 5 件低库存 · 2 件用完</p>')+
  E('div','card',E('div','stat-row',
    E('div','stat-item','<b style="color:var(--orange)">3</b><span>临期</span>')+
    E('div','stat-item','<b style="color:var(--red)">5</b><span>低库存</span>')+
    E('div','stat-item','<b style="color:var(--green)">120</b><span>正常</span>')
  ))+
  E('div','act-row',
    E('div','act-tile',svg('ic-plus')+'<b>新增物品</b><small>手动录入</small>')+
    E('div','act-tile',svg('ic-scan')+'<b>扫码</b><small>定位/绑定</small>')
  )+
  E('div','section-head','<b>快捷入口</b>')+
  E('div','quick-row',
    '<button class="quick-btn">画材</button>'+
    '<button class="quick-btn">工具</button>'+
    '<button class="quick-btn">A柜</button>'+
    '<button class="quick-btn">工具柜</button>'
  )+
  E('div','section-head','<b>最近物品</b><a>全部 ›</a>')+
  E('div','card',
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>温莎牛顿 24色颜料</b><small>书房A柜 / 2层 / 蓝盒</small>')+E('div','list-right','<span class="tag warn">30天</span>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>8K 水彩纸</b><small>工具柜 / 1层</small>')+E('div','list-right','<span class="tag bad">低库存</span>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>3M 美纹纸胶带</b><small>工具柜 / B盒</small>')+E('div','list-right','<b style="font-size:13px">×4</b>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>A4 素描纸</b><small>书房A柜 / 3层</small>')+E('div','list-right','<b style="font-size:13px">×20</b>'))
  );

P.items=
  E('div','search-bar',svg('ic-search')+'<span>搜索物品、分类、位置</span>')+
  E('div','chip-row',
    '<button class="chip on">全部</button>'+
    '<button class="chip">画材</button>'+
    '<button class="chip">工具</button>'+
    '<button class="chip">纸张</button>'
  )+
  E('div','section-head','<b>全部物品</b><a>+ 新增</a>')+
  E('div','card',
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>温莎牛顿 24色颜料</b><small>画材 · 书房A柜/2层/蓝盒</small>')+E('div','list-right','<span class="tag warn">30天</span>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>8K 水彩纸</b><small>纸张 · 工具柜/1层</small>')+E('div','list-right','<span class="tag bad">低</span>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>3M 美纹纸胶带</b><small>工具 · 工具柜/B盒</small>')+E('div','list-right','<b style="font-size:13px">×4</b>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>A4 素描纸</b><small>纸张 · 书房A柜/3层</small>')+E('div','list-right','<b style="font-size:13px">×20</b>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>辉柏嘉彩铅48色</b><small>画材 · 书房A柜/2层</small>')+E('div','list-right','<b style="font-size:13px">×1</b>'))+
    E('div','list-item',E('div','list-icon',svg('ic-box'))+E('div','list-info','<b>美工刀 大号</b><small>工具 · 工具柜/A盒</small>')+E('div','list-right','<b style="font-size:13px">×2</b>'))
  );

P.detail=
  E('div','detail-hero',
    '<div style="font-size:10px;color:var(--muted)">画材 · 书房A柜/2层/蓝盒</div>'+
    '<h2>温莎牛顿 24色颜料</h2>'+
    '<div class="count">3</div>'+
    '<span class="tag warn">30天后到期</span>'
  )+
  E('div','card',
    E('div','info-row','<span class="k">分类</span><span class="v">画材</span>')+
    E('div','info-row','<span class="k">位置</span><span class="v">书房A柜 / 2层 / 蓝盒</span>')+
    E('div','info-row','<span class="k">数量</span><span class="v">3</span>')+
    E('div','info-row','<span class="k">到期</span><span class="v" style="color:var(--orange)">30天后</span>')
  )+
  E('div','act-row',
    '<button class="btn btn-o">'+svg('ic-minus')+'消耗</button>'+
    '<button class="btn btn-o">'+svg('ic-plus')+'补货</button>'
  )+
  '<button class="btn btn-o" style="width:100%">'+svg('ic-edit')+'移动位置</button>'+
  '<button class="btn btn-d">删除物品</button>';

P.form=
  E('div','section-head','<b>新增物品</b>')+
  E('div','card',
    E('div','form-field','<label>物品名称</label><input class="input" placeholder="如：温莎牛顿颜料">')+
    E('div','form-field','<label>分类</label><input class="input" placeholder="选择分类">')+
    E('div','form-field','<label>存放位置</label><input class="input" placeholder="选择柜子/盒子">')+
    E('div','form-field','<label>数量</label><input class="input" type="number" value="1">')+
    E('div','form-field','<label>到期日期</label><input class="input" type="date">')
  )+
  '<button class="btn btn-p">确认录入</button>';

P.space=
  E('div','chip-row',
    '<button class="chip on">空间树</button>'+
    '<button class="chip">分类树</button>'
  )+
  E('div','section-head','<b>存储空间</b><a>+ 柜子</a>')+
  E('div','tree-item',E('div','list-icon',svg('ic-cab'))+E('div','tree-body',
    '<b>书房 A 柜</b>'+
    '<div style="margin-top:3px"><small>3层 · 7盒 · 46件</small><span class="tag ok" style="margin-left:6px">正常</span></div>'+
    '<div class="progress"><div class="bar" style="width:62%"></div></div>')+
    '<span style="color:var(--muted)">'+svg('ic-chevron-r')+'</span>'
  )+
  E('div','tree-item',E('div','list-icon',svg('ic-cab'))+E('div','tree-body',
    '<b>工具柜</b>'+
    '<div style="margin-top:3px"><small>2层 · 5盒 · 31件</small><span class="tag warn" style="margin-left:6px">偏满</span></div>'+
    '<div class="progress"><div class="bar" style="width:88%;background:var(--orange)"></div></div>')+
    '<span style="color:var(--muted)">'+svg('ic-chevron-r')+'</span>'
  )+
  E('div','tree-item',E('div','list-icon',svg('ic-cab'))+E('div','tree-body',

<script>
// ===== INTERACTIONS =====
// Tab switching
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    var pid = this.dataset.pid;
    var tab = this.dataset.tab;
    var scroll = document.getElementById(pid+'-scroll');
    // Update active tab
    this.parentElement.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
    this.classList.add('on');
    // Show page
    scroll.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    var target = document.getElementById(pid+'-p-'+tab);
    if(target) target.classList.add('active');
    scroll.scrollTop = 0;
    // Title
    document.getElementById(pid+'-title').textContent = ({home:'首页',items:'物品',space:'空间',profile:'我的'})[tab]||'';
    document.getElementById(pid+'-back').classList.remove('show');
  });
});

// Item click → detail
document.querySelectorAll('.list-item').forEach(function(item){
  item.addEventListener('click',function(){
    var phone = this.closest('.phone');
    if(!phone) return;
    var tabBtn = phone.querySelector('.tab');
    if(!tabBtn) return;
    var pid = tabBtn.dataset.pid;
    var scroll = document.getElementById(pid+'-scroll');
    scroll.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    var d = document.getElementById(pid+'-p-detail');
    if(d) d.classList.add('active');
    scroll.scrollTop = 0;
    document.getElementById(pid+'-title').textContent = '物品详情';
    document.getElementById(pid+'-back').classList.add('show');
  });
});

// Back buttons
document.querySelectorAll('.back').forEach(function(b){
  b.addEventListener('click',function(){
    var pid = this.id.replace('-back','');
    var phone = this.closest('.screen');
    var activeTab = phone.querySelector('.tab.on');
    var tab = activeTab ? activeTab.dataset.tab : 'home';
    var scroll = document.getElementById(pid+'-scroll');
    scroll.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    var target = document.getElementById(pid+'-p-'+tab);
    if(target) target.classList.add('active');
    scroll.scrollTop = 0;
    document.getElementById(pid+'-title').textContent = ({home:'首页',items:'物品',space:'空间',profile:'我的'})[tab]||'';
    this.classList.remove('show');
  });
});

// Scan buttons
document.querySelectorAll('.scan-btn').forEach(function(b){
  b.addEventListener('click',function(){
    var phone = this.closest('.phone');
    var tabBtn = phone.querySelector('.tab');
    var pid = tabBtn.dataset.pid;
    var scroll = document.getElementById(pid+'-scroll');
    scroll.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    var d = document.getElementById(pid+'-p-scan');
    if(d) d.classList.add('active');
    scroll.scrollTop = 0;
    document.getElementById(pid+'-title').textContent = '扫码';
    document.getElementById(pid+'-back').classList.add('show');
  });
});

// Tree item click → navigate deeper (space tree demo)
document.querySelectorAll('.tree-item').forEach(function(item){
  item.addEventListener('click',function(){
    var phone = this.closest('.phone');
    if(!phone) return;
    var tabBtn = phone.querySelector('.tab');
    var pid = tabBtn.dataset.pid;
    var scroll = document.getElementById(pid+'-scroll');
    var page = scroll.querySelector('.page.active');
    var pageId = page ? page.id : '';
    // Simple toggle: if on space page, go to layers; if on layers, go to boxes
    if(pageId.endsWith('-space')){
      scroll.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
      var d = document.getElementById(pid+'-p-layers');
      if(d) d.classList.add('active');
      scroll.scrollTop = 0;
      document.getElementById(pid+'-title').textContent = '书房 A 柜';
      document.getElementById(pid+'-back').classList.add('show');
    }else if(pageId.endsWith('-layers')){
      scroll.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
      var d = document.getElementById(pid+'-p-boxes');
      if(d) d.classList.add('active');
      scroll.scrollTop = 0;
      document.getElementById(pid+'-title').textContent = '1层';
    }
  });
});
</script>
